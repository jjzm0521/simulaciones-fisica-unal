<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Laboratorio de movimiento parabólico</title>
<link rel="stylesheet" data-inline="../../../biblioteca/fuentes/fuentes.css">
<link rel="stylesheet" data-inline="../../../biblioteca/interfaz/tokens.css">
<link rel="stylesheet" data-inline="../../../biblioteca/interfaz/interfaz.css">
</head><body>

<div class="wrap">
  <header class="top">
    <div class="titulo">
      <div class="eyebrow">Universidad Nacional de Colombia · Sede Medellín · Física Mecánica · Práctica 7</div>
      <h1>Laboratorio de movimiento parabólico</h1>
    </div>
    <div class="modes" role="group" aria-label="Modo">
      <button class="mode" type="button" data-app="explore">Explorar</button>
      <button class="mode" type="button" data-app="lab">Laboratorio</button>
      <button class="interruptor" type="button" id="bGuide" role="switch" aria-checked="true" title="Mostrar u ocultar la guía de la práctica">Paso a paso</button>
    </div>
    <div class="speed">
      <label for="speed">Velocidad de la simulación</label>
      <select id="speed">
        <option value="1">Tiempo real</option>
        <option value="0.5" selected>Cámara lenta ×0,5</option>
        <option value="0.2">Cámara lenta ×0,2</option>
      </select>
    </div>
  </header>

  <nav class="steps" aria-label="Pasos de la práctica"><ol id="steps"></ol></nav>
  <div class="dock" role="toolbar" aria-label="Qué mostrar">
    <button class="dk" type="button" data-ui="card" title="Panel de la práctica (P)"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2.5" y="3.5" width="15" height="13" rx="2"/><path d="M12 3.5v13"/></svg>Panel</button>
    <button class="dk" type="button" data-ui="scope" title="Ventana del PhysicsSensor (S)"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><rect x="2.5" y="3.5" width="15" height="13" rx="2"/><path d="M4.5 12h3l1-4h3l1 4h3"/></svg>Sensor</button>
    <button class="dk" type="button" data-ui="labels" title="Etiquetas y medidas en la escena (E)"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3 10.5 9.5 4H16v6.5L9.5 17z"/><circle cx="13" cy="7" r="1.2"/></svg>Rótulos</button>
    <button class="dk" type="button" data-ui="proyector" title="Letra grande, para proyector (L)"><b>Aa</b>Letra</button>
    <button class="dk" type="button" data-ui="tema" title="Tema claro u oscuro (O)"><svg class="i-luna" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M16.5 11.8A6.8 6.8 0 0 1 8.2 3.5a6.8 6.8 0 1 0 8.3 8.3z"/></svg><svg class="i-sol" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="10" cy="10" r="3.4"/><path d="M10 2.5v2M10 15.5v2M2.5 10h2M15.5 10h2M4.7 4.7l1.4 1.4M13.9 13.9l1.4 1.4M4.7 15.3l1.4-1.4M13.9 6.1l1.4-1.4"/></svg>Tema</button>
  <button class="dk solo-movil" type="button" id="dkVel" title="Velocidad de la simulación"><b>×0,5</b>Ritmo</button>
  <button class="dk sep" type="button" data-ui="clean" title="Ver solo la escena (H)"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3 7V3h4M13 3h4v4M17 13v4h-4M7 17H3v-4"/></svg>Limpia</button>
  </div>
  <div class="vivo" id="vivo" hidden></div>
  <button class="unclean" type="button" id="unclean">Mostrar paneles · H</button>
  <div class="hud" id="hud" hidden aria-live="polite"></div>
  <div class="pad" id="pad" hidden role="group" aria-label="Controles del lanzamiento"></div>

  <main class="layout">
    <section class="stage">
      <div class="panel viewpanel">
        <div id="view" role="img" aria-label="Escena 3D: esfera que baja por una rampa, sale por el borde de la mesa y cae al piso describiendo una parábola"></div>
        <div class="viewbtns" role="group" aria-label="Cámara">
          <button class="vb" type="button" data-v="iso" data-s="3D">Vista 3D</button>
          <button class="vb" type="button" data-v="side" data-s="Lado">Lateral</button>
          <button class="vb" type="button" data-v="top" data-s="Arriba">Superior</button>
          <button class="vb" type="button" data-v="gate" data-s="Compuerta">Fotocompuerta</button>
        </div>
      </div>
      <div class="scopeblock" id="scopeWrap" hidden>
        <div class="pswin" role="group" aria-label="Programa PhysicsSensor 1.1">
          <div class="ps-title">
            <span class="ps-un">un</span>
            <span class="ps-tt">PhysicsSensor: Sonograma -muestreo a 44100 Hz-</span>
            <span class="ps-wbtns"><button class="ps-wb" type="button" data-ven="plegar" title="Plegar o desplegar" aria-label="Plegar o desplegar la ventana">–</button><button class="ps-wb" type="button" data-ven="cerrar" title="Cerrar (S)" aria-label="Cerrar la ventana">✕</button></span>
          </div>
          <div class="ps-menu">Archivos</div>
          <div class="ps-slider" aria-hidden="true"><span class="ps-thumb"></span></div>
          <fieldset class="ps-group">
            <legend>Sonograma</legend>
            <canvas id="scope" aria-label="Señal de la fotocompuerta en el sonograma"></canvas>
          </fieldset>
          <fieldset class="ps-group">
            <legend>Controles</legend>
            <div class="ps-row">
              <button class="ps-btn" type="button" title="El pulso se captura automáticamente al soltar la esfera" disabled><svg width="16" height="12" viewBox="0 0 16 12" aria-hidden="true"><path d="M1 6C3 2 6 1 8 1s5 1 7 5c-2 4-5 5-7 5S3 10 1 6z" fill="#fff" stroke="#3b5f8f"/><circle cx="8" cy="6" r="2.6" fill="#3b5f8f"/></svg>Capturar</button>
              <button class="ps-btn" type="button" disabled><svg width="16" height="12" viewBox="0 0 16 12" aria-hidden="true"><path d="M1 6C3 2 6 1 8 1s5 1 7 5c-2 4-5 5-7 5S3 10 1 6z" fill="#fff" stroke="#3b5f8f"/><circle cx="8" cy="6" r="2.6" fill="#3b5f8f"/></svg>Sonograma</button>
              <button class="ps-btn" type="button" data-z="ey+" title="Ampliar la escala vertical"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><circle cx="5.5" cy="5.5" r="4" fill="#e9f3ff" stroke="#3b6aa0" stroke-width="1.4"/><path d="M8.6 8.6L13 13" stroke="#3b6aa0" stroke-width="2" stroke-linecap="round"/></svg>+ Ey</button>
              <button class="ps-btn" type="button" data-z="ey-" title="Reducir la escala vertical"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><circle cx="5.5" cy="5.5" r="4" fill="#e9f3ff" stroke="#3b6aa0" stroke-width="1.4"/><path d="M8.6 8.6L13 13" stroke="#3b6aa0" stroke-width="2" stroke-linecap="round"/></svg>- Ey</button>
              <button class="ps-btn" type="button" data-z="ex+" title="Ampliar la escala de tiempo"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><circle cx="5.5" cy="5.5" r="4" fill="#e9f3ff" stroke="#3b6aa0" stroke-width="1.4"/><path d="M8.6 8.6L13 13" stroke="#3b6aa0" stroke-width="2" stroke-linecap="round"/></svg>+ Ex</button>
              <button class="ps-btn" type="button" data-z="ex-" title="Reducir la escala de tiempo"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><circle cx="5.5" cy="5.5" r="4" fill="#e9f3ff" stroke="#3b6aa0" stroke-width="1.4"/><path d="M8.6 8.6L13 13" stroke="#3b6aa0" stroke-width="2" stroke-linecap="round"/></svg>- Ex</button>
            </div>
          </fieldset>
        </div>
        <p class="note" id="scopeInfo">Sin señal: suelta la esfera para registrar el pulso.</p>
      </div>
    </section>
    <section class="card" id="card" aria-live="polite"></section>
  </main>
</div>

<script data-inline="../../../biblioteca/nucleo/three-r159.min.js"></script>
<script data-inline="../../../biblioteca/nucleo/camara.js"></script>
<script data-inline="../../../biblioteca/nucleo/rotulos.js"></script>
<script data-inline="../../../biblioteca/nucleo/ambiente.js"></script>
<script data-inline="../../../biblioteca/piezas/soporte.js"></script>
<script data-inline="../../../biblioteca/piezas/fotocompuerta.js"></script>
<script data-inline="../../../biblioteca/fisica/incertidumbre.js"></script>
<script data-inline="../../../biblioteca/interfaz/interfaz.js"></script>
<script>
(function(){
'use strict';
const $=(s,r=document)=>r.querySelector(s);
const NS='http://www.w3.org/2000/svg';
function el(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in (attrs||{}))e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;}

/* ---------- constantes y estado ---------- */
const G=9.77, S=300, X0=330, YF=420, RL=118, XG=X0;   // XG: haz de la fotocompuerta justo en el borde de la rampa (x = 0)
let R=7;                                   // radio de la esfera dibujada (px); se exagera ×2,9 respecto al real
const AP=1/3648, AP_TXT='2.7412280701754384E-4';   // apreciación del PhysicsSensor (s)
const NOM={H:0.950,h:0.100,d:0.0160};
const LIM={d:[0.0120,0.0250,0.00005],H:[0.700,1.150,0.001],h:[0.050,0.250,0.001]};
const P={H:NOM.H,h:NOM.h,d:NOM.d};
const U={H:0.001,d:0.00005,D:0.001,tau:AP,h:0.001};
let seed=11, trials=[], path=[], Troll=0, recorded=[], speed=0.5, cur=0, seen=new Set([0]);
let anim=null, chainToken=0, busy=false, scopeTau=null;
let manual=null, pend=null;   // manual: cursores que mueve el estudiante {a,b} (s, desde el inicio del pulso) · pend: lanzamiento sin registrar
const did={tau:false,vuelo:false,calc:false};
let app='explore', guide=true, page='', curPage=null, expN=0, answers={}, showSol=false;
const CLAVE='parabolico-ui';
const UI=Lab.ui.cargarPreferencias(CLAVE,{scopeX:false});
try{ if(matchMedia('(max-width:760px)').matches&&!localStorage.getItem(CLAVE)) UI.scope=false; }catch(e){}
let lastCfg=null;
const AX={x:1,y:1};   // x: +1 hacia la derecha · y: +1 hacia abajo (marco de la guía); −1 invierte el eje

const {fx,r1,pair,sg}=Lab.fisica;   // biblioteca/fisica/incertidumbre.js
const yr=()=>YF-P.H*S;

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function gauss(r){let u=0;while(!u)u=r();const v=r();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
const TF=()=>Math.sqrt(2*P.H/G);
const V0model=()=>Math.sqrt(10/7*G*P.h);

function genTrials(){
  const r=mulberry32(seed*9973+Math.round(P.H*1000)+Math.round(P.h*1000)+Math.round(P.d*10000));
  const v0=V0model(), tf=TF(); trials=[];
  for(let i=0;i<6;i++){
    const tau=Math.max(1,Math.round(P.d/v0*(1+0.03*gauss(r))/AP))*AP;   // el PhysicsSensor mide en múltiplos de la apreciación
    const D=Math.round(v0*tf*0.985*(1+0.012*gauss(r))*1e3)/1e3;
    trials.push({tau,D});
  }
}
function buildPath(){
  const N=240, hpx=P.h*S; path=[]; let T=0, Lm=0;
  for(let i=0;i<=N;i++){
    const s=i/N, x=X0-RL*(1-s), y=yr()-R-hpx*(1-s)*(1-s);
    const drop=P.h*(1-(1-s)*(1-s)), v=Math.sqrt(10/7*G*drop);
    if(i>0){const p=path[i-1]; const dl=Math.hypot(x-p.x,y-p.y)/S; Lm+=dl; T+=dl/Math.max((v+p.v)/2,1e-6);}
    path.push({x,y,v,T,Lm});
  }
  Troll=path[path.length-1].T;
}
function pathAt(t){
  let lo=0,hi=path.length-1;
  while(hi-lo>1){const m=(lo+hi)>>1; if(path[m].T<=t) lo=m; else hi=m;}
  const a=path[lo],b=path[hi], f=b.T>a.T?(t-a.T)/(b.T-a.T):0;
  return {x:a.x+(b.x-a.x)*f,y:a.y+(b.y-a.y)*f,Lm:a.Lm+(b.Lm-a.Lm)*f};
}
function gateY(){ return yr()-R; }   // altura del centro de la esfera en el borde de la rampa

/* ---------- escena 3D ---------- */
/* Colores de la interfaz: se leen del token vigente, así siguen al tema y al modo proyector. La paleta del 3D que no es token vive en ambiente.js. */
const cs=getComputedStyle(document.documentElement);
const sv=n=>cs.getPropertyValue(n).trim();
const pal=()=>Lab.escena.paleta(Lab.ui.tema());
const view=$('#view');
if(typeof THREE==='undefined'||!THREE.CamaraOrbita){
  view.innerHTML='<p style="padding:24px;color:var(--muted)">No se pudo cargar el motor 3D. Revisa tu conexión y recarga la página.</p>';
  return;
}
let renderer;
try{ renderer=new THREE.WebGLRenderer({antialias:true,alpha:true}); }
catch(e){ view.innerHTML='<p style="padding:24px;color:var(--muted)">Este navegador no puede mostrar gráficos 3D (WebGL).</p>'; return; }
// r159 con el aspecto de r128: sin gestión de color; las luces van ×π (equivale a la iluminación clásica)
THREE.ColorManagement.enabled=false; renderer.outputColorSpace=THREE.LinearSRGBColorSpace;
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
view.appendChild(renderer.domElement);

const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(38,1.6,0.05,60);
const controls=new THREE.CamaraOrbita(camera,renderer.domElement);
renderer.domElement.style.touchAction='pan-y';
controls.maxPolarAngle=Math.PI*0.49; controls.minDistance=0.4; controls.maxDistance=7.5;
let dirty=true;
controls.addEventListener('change',()=>{dirty=true;});

// fondo y luces según el tema (ambiente.js). El laboratorio trae su propio piso: sin piso ni rejilla de la biblioteca.
Lab.escena.ambiente(scene,Lab.ui.tema(),{piso:false,rejilla:false,sol:{pos:[1.4,3.2,2.0],sombra:{mapa:2048,caja:2,near:0.5,far:9,bias:-0.0005}}});

const groups={};
['gFloor','gRuler','gTable','gDimH','gDimD','gGhost','gAxes','gGate','gProj','gStrobe','gMarks','gLabels'].forEach(n=>{groups[n]=new THREE.Group();scene.add(groups[n]);});
const G_=id=>groups[id];
function disposeObj(o){ o.traverse(n=>{ if(n.geometry) n.geometry.dispose(); if(n.material){ if(n.material.map) n.material.map.dispose(); n.material.dispose(); } }); }
function clear(g){ while(g.children.length){ const c=g.children[0]; g.remove(c); disposeObj(c); } dirty=true; }

const wx=px=>(px-X0)/S, wy=py=>(YF-py)/S; let RM=R/S;
const tcol=n=>new THREE.Color(sv(n));
const mixc=(a,b,t)=>a.clone().lerp(b,t);

function labelSprite(text,color,h,mono){
  const fs=64, f=(mono?'500 ':'700 ')+fs+'px '+(mono?'"IBM Plex Mono",monospace':'"Bricolage Grotesque",sans-serif');
  const c=document.createElement('canvas'), x=c.getContext('2d'); x.font=f;
  const w=Math.ceil(x.measureText(text).width)+28; c.width=w; c.height=fs+28;
  x.font=f; x.textAlign='center'; x.textBaseline='middle'; x.lineJoin='round'; x.lineWidth=10;
  x.strokeStyle=sv('--surface'); x.strokeText(text,w/2,c.height/2+2); x.fillStyle=color; x.fillText(text,w/2,c.height/2+2);
  const t=new THREE.CanvasTexture(c); t.anisotropy=4;
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:t,transparent:true,depthTest:false}));
  sp.scale.set(h*c.width/c.height,h,1); sp.renderOrder=10; sp.userData.px=mono?[16,34]:[18,40]; return sp;
}
function pillSprite(text,dot,h){
  const fs=44, f='500 '+fs+'px "IBM Plex Mono",monospace';
  const c=document.createElement('canvas'), x=c.getContext('2d'); x.font=f;
  const pad=26, w=Math.ceil(x.measureText(text).width)+pad*2+34, H=fs+34; c.width=w; c.height=H;
  const P_=pal().pastilla, r=H/2; x.fillStyle=P_.fondo; x.beginPath(); x.moveTo(r,0); x.lineTo(w-r,0); x.arc(w-r,r,r,-Math.PI/2,Math.PI/2); x.lineTo(r,H); x.arc(r,r,r,Math.PI/2,Math.PI*1.5); x.closePath(); x.fill(); x.lineWidth=5; x.strokeStyle=P_.borde; x.stroke();
  x.fillStyle=dot; x.beginPath(); x.arc(pad+8,H/2,9,0,Math.PI*2); x.fill();
  x.font=f; x.fillStyle=P_.texto; x.textAlign='left'; x.textBaseline='middle'; x.fillText(text,pad+34,H/2+2);
  const t=new THREE.CanvasTexture(c); t.anisotropy=4;
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:t,transparent:true,depthTest:false}));
  sp.scale.set(h*w/H,h,1); sp.renderOrder=10; sp.userData.px=[18,30]; return sp;
}
function box(w,h,d,mat,x,y,z){ const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat); m.position.set(x,y,z); m.castShadow=true; m.receiveShadow=true; return m; }
function poly(pts,color,dash){
  const g=new THREE.BufferGeometry().setFromPoints(pts.map(p=>new THREE.Vector3(p[0],p[1],p[2])));
  const m=dash?new THREE.LineDashedMaterial({color,dashSize:0.02,gapSize:0.015}):new THREE.LineBasicMaterial({color});
  const l=new THREE.Line(g,m); if(dash) l.computeLineDistances(); return l;
}
function tapeTex(){
  const c=document.createElement('canvas'); c.width=2400; c.height=100; const x=c.getContext('2d');
  const cinta=pal().cinta, ink=cinta.tinta;
  x.fillStyle=cinta.fondo; x.fillRect(0,0,2400,100);
  x.strokeStyle=ink; x.fillStyle=ink; x.lineWidth=2;
  for(let mm=0;mm<=1200;mm+=10){ const p=mm*2, len=mm%100===0?48:(mm%50===0?34:20); x.beginPath(); x.moveTo(p+1,0); x.lineTo(p+1,len); x.stroke(); }
  x.font='700 26px "IBM Plex Mono",monospace'; x.textAlign='left';
  for(let cm=0;cm<=110;cm+=10) x.fillText(String(cm),cm*20+8,88);
  x.fillText('cm',2360,88);
  const t=new THREE.CanvasTexture(c); t.anisotropy=4; return t;
}


/* ---------- laboratorio (entorno fijo, siempre claro) ---------- */
const room=new THREE.Group(); scene.add(room);
(function buildRoom(){
  const std=(c,r,m)=>new THREE.MeshStandardMaterial({color:c,roughness:r==null?0.9:r,metalness:m||0});
  const plane=(w,h,m,x,y,z,ry,rx)=>{ const o=new THREE.Mesh(new THREE.PlaneGeometry(w,h),m); o.position.set(x,y,z); if(ry) o.rotation.y=ry; if(rx) o.rotation.x=rx; o.receiveShadow=true; room.add(o); return o; };
  const rbox=(w,h,d,m,x,y,z,cast)=>{ const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m); o.position.set(x,y,z); o.receiveShadow=true; o.castShadow=!!cast; room.add(o); return o; };
  const XL=-3.6, XR=4.2, ZB=-2.4, ZF=4.2, HT=3.0, CX=(XL+XR)/2, CZ=(ZB+ZF)/2, W=XR-XL, L=ZF-ZB;

  // piso: baldosas de 60 cm celeste grisáceo con juntas finas
  const fc=document.createElement('canvas'); fc.width=fc.height=512; const f2=fc.getContext('2d'); const rr=mulberry32(9);
  for(let ty=0;ty<2;ty++) for(let tx=0;tx<2;tx++){ const d=(rr()*10-5)|0; f2.fillStyle='rgb('+(158+d)+','+(170+d)+','+(186+d)+')'; f2.fillRect(tx*256,ty*256,256,256); }
  for(let k=0;k<3200;k++){ f2.fillStyle=rr()<0.5?'rgba(255,255,255,.10)':'rgba(70,90,120,.08)'; f2.fillRect(rr()*512,rr()*512,1+rr()*2.4,1+rr()*2.4); }
  f2.strokeStyle='rgba(88,104,128,.75)'; f2.lineWidth=3; f2.strokeRect(0,0,512,512);
  f2.beginPath(); f2.moveTo(256,0); f2.lineTo(256,512); f2.moveTo(0,256); f2.lineTo(512,256); f2.stroke();
  const ft=new THREE.CanvasTexture(fc); ft.wrapS=ft.wrapT=THREE.RepeatWrapping; ft.repeat.set(W/1.2,L/1.2); ft.anisotropy=8;
  plane(W,L,new THREE.MeshStandardMaterial({map:ft,roughness:0.55,metalness:0.02}),CX,0,CZ,0,-Math.PI/2);

  // paredes blancas y zócalo oscuro
  const wall=std(0xdcdcd8,0.95);
  plane(W,HT,wall,CX,HT/2,ZB);
  plane(L,HT,wall,XL,HT/2,CZ,Math.PI/2);
  plane(L,HT,wall,XR,HT/2,CZ,-Math.PI/2);
  plane(W,HT,wall,CX,HT/2,ZF,Math.PI);
  const skirt=std(0x0b1426,0.5,0.2);
  rbox(W,0.1,0.04,skirt,CX,0.05,ZB+0.02);
  rbox(0.04,0.1,L,skirt,XL+0.02,0.05,CZ);

  // mueble inferior de madera oscura con mesón azul marino
  const wood=std(0x4a2314,0.6), woodL=std(0x5e2f1b,0.55), navy=std(0x0d1730,0.35,0.3), metal=std(0xb8bec6,0.35,0.8);

  if(a.phase==='roll'){

/* ---------- sonograma del PhysicsSensor ---------- */
/* Forma de la señal tomada del sonograma real (carpeta adicional): la señal sube rápido y de forma cóncava al
   interrumpirse el haz, se queda casi plana mientras la esfera tapa el haz y, cuando el haz se libera, baja con una
   cola exponencial. τ se mide entre el punto donde la gráfica EMPIEZA A SUBIR y el punto donde EMPIEZA A BAJAR. */
const TW0=0.12; let ex=1, ey=1, scopeF=1;
const tauTxt=t=>String(Number(t.toPrecision(15)));
const tauManual=()=>Math.round(Math.abs(manual.b-manual.a)/AP)*AP;
function nuevoManual(){ const T=TW0/ex, t1=T/2-scopeTau/2; return {a:0.30*T-t1,b:0.74*T-t1}; }
function sweepScope(){ scopeF=0; const t0=performance.now(); (function f(now){ scopeF=Math.min(1,(now-t0)/800); drawScope(); if(scopeF<1) requestAnimationFrame(f); })(t0); }
function hash(i){ const v=Math.sin(i*12.9898+78.233)*43758.5453; return v-Math.floor(v); }
/* La señal se genera con la geometría real: el haz es un disco de radio RB a la altura del centro de la esfera,
   y la señal es la fracción del haz que tapa la silueta de la esfera (radio d/2) mientras avanza a v = d/τ.
   · Empieza a subir cuando el borde delantero toca el haz y empieza a bajar cuando el borde trasero llega a él:
     entre esos dos puntos pasan exactamente d/v = τ, para cualquier diámetro.
   · La subida y la bajada duran 2·RB/v (no dependen de d), así que una esfera grande da una meseta más larga.
   · Filtro pasa-bajos (respuesta del fotodiodo) y pasa-altos (entrada de audio del computador): caída suave de la
     meseta y la pequeña cola por debajo de la base al final, como en el sonograma real. */
const RB=0.0010, T_LP=0.0004, T_HP=0.15;
function beamFrac(dc,r,rb){
  dc=Math.abs(dc); if(dc>=r+rb) return 0; if(dc<=r-rb) return 1;
  const r2=r*r,b2=rb*rb;
  const a=r2*Math.acos((dc*dc+r2-b2)/(2*dc*r))+b2*Math.acos((dc*dc+b2-r2)/(2*dc*rb))-0.5*Math.sqrt((-dc+r+rb)*(dc+r-rb)*(dc-r+rb)*(dc+r+rb));
  return a/(Math.PI*b2);
}
function signal(T,tau,t1,n){            // n+1 muestras de la señal normalizada en t = i·T/n
  const r=P.d/2, v=P.d/tau, dt=Math.min(2e-5,T/n/4), N=Math.ceil(T/dt), out=new Float32Array(n+1);
  const aL=dt/(T_LP+dt), aH=T_HP/(T_HP+dt); let lp=0,prev=0,hp=0,j=0;
  for(let k=0;k<=N&&j<=n;k++){ const t=k*dt;
    lp+=aL*(beamFrac(-(r+RB)+v*(t-t1),r,RB)-lp); hp=aH*(hp+lp-prev); prev=lp;
    while(j<=n&&j*T/n<=t) out[j++]=hp; }
  while(j<=n) out[j++]=hp;
  return out;
}
function drawScope(){
  const c=$('#scope'); if(!c) return; const w=c.clientWidth,h=c.clientHeight; if(!w) return;
  const dpr=window.devicePixelRatio||1;
  if(c.width!==Math.round(w*dpr)||c.height!==Math.round(h*dpr)){c.width=Math.round(w*dpr);c.height=Math.round(h*dpr);}
  const ctx=c.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,w,h);
  const T=TW0/ex, yb=h*0.66, amp=h*0.30*ey, has=scopeTau!=null, tau=has?scopeTau:0;
  const t1=T*0.5-tau*0.5;                // el pulso queda centrado en la ventana
  // cuadrícula
  ctx.strokeStyle='#dcdcdc'; ctx.lineWidth=1; ctx.beginPath();
  for(let i=1;i<18;i++){ const x=Math.round(w*i/18)+0.5; ctx.moveTo(x,0); ctx.lineTo(x,h); }
  for(let j=1;j<6;j++){ const y=Math.round(h*j/6)+0.5; ctx.moveTo(0,y); ctx.lineTo(w,y); }
  ctx.stroke();
  // línea roja horizontal de referencia
  const yr0=Math.round(h*0.5)+0.5;
  ctx.strokeStyle='#e8383d'; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(0,yr0); ctx.lineTo(w,yr0); ctx.stroke();
  // señal: línea base con deriva lenta y pequeños escalones, más el pulso
  const tcut = !has||scopeF>=1 ? T : T*(0.45+0.55*scopeF);
  const sig = has ? signal(T,tau,t1,w) : null;
  ctx.strokeStyle='#2a2a2a'; ctx.lineWidth=1.1; ctx.lineJoin='round'; ctx.beginPath();
  for(let i=0;i<=w;i++){
    const t=i/w*T; if(t>tcut) break;
    const drift=(0.5-i/w)*0.32*h*0.30;                         // la base sube suavemente de izquierda a derecha
    const step=Math.round(drift/1.5)*1.5;
    const blip=hash(i)>0.94?(hash(i+7)>0.5?1.2:-1.2):0;
    const y=yb+step+blip-(has?sig[i]*amp:0);
    if(i===0) ctx.moveTo(i,y+0.5); else ctx.lineTo(i,y+0.5);
  }
  ctx.stroke();
  // cursores: inicio de la subida e inicio de la bajada
  if(has&&scopeF>=1){
    const xa=Math.round((t1+(manual?manual.a:0))/T*w)+0.5, xb=Math.round((t1+(manual?manual.b:tau))/T*w)+0.5;
    ctx.strokeStyle='#4a4af0'; ctx.lineWidth=manual?1.6:1; ctx.beginPath(); ctx.moveTo(xa,0); ctx.lineTo(xa,h); ctx.moveTo(xb,0); ctx.lineTo(xb,h); ctx.stroke();
    if(manual&&!manual.fijo){ ctx.fillStyle='#4a4af0'; [xa,xb].forEach(x=>{ ctx.beginPath(); ctx.moveTo(x-6,0); ctx.lineTo(x+6,0); ctx.lineTo(x,9); ctx.closePath(); ctx.fill(); ctx.beginPath(); ctx.moveTo(x-6,h); ctx.lineTo(x+6,h); ctx.lineTo(x,h-9); ctx.closePath(); ctx.fill(); }); }
  }
  ctx.font='12px Tahoma, "Segoe UI", Arial, sans-serif'; ctx.fillStyle='#1c1c1c'; ctx.textAlign='left'; ctx.textBaseline='alphabetic';
  ctx.fillText('Intervalo de tiempo = '+(has&&scopeF>=1?tauTxt(manual?tauManual():tau):'0.0')+'  s',8,19);
  ctx.fillText('Apreciación='+AP_TXT+' s',8,36);
  ctx.fillText('[Graba hasta 12 s]',6,h-26);
  ctx.fillText('Autor:  Diego L. Aristizábal R.   Copyright 2010-2013',6,h-9);
  const [tv,tu]=pair(tau,U.tau);
  const mide=!!manual&&!manual.fijo; $('#scope').style.cursor=mide?'ew-resize':''; document.body.classList.toggle('midiendo',mide);
  $('#scopeInfo').textContent = !has ? 'Sin señal: suelta la esfera para registrar el pulso.'
    : manual&&manual.fijo ? 'Registrado con tus cursores: τ = '+fx(tauManual(),4)+' s. La incertidumbre de lectura es la apreciación del programa.'
    : manual ? 'Ahora mides tú: arrastra los dos cursores azules. Uno donde la señal empieza a subir y otro donde empieza a bajar. Usa + Ex para ampliar el tiempo.'
    : 'Esfera de d = '+fx(P.d*1000,2)+' mm. Cursores en el inicio de la subida y en el inicio de la bajada: τ = '+tv+' ± '+tu+' s (la incertidumbre es la apreciación del programa). La subida dura lo mismo para cualquier esfera; una esfera más grande tapa el haz más tiempo.';
}

/* ---------- cálculos ---------- */
function stats(){
  const ds=recorded.map(i=>trials[i].D), ts=recorded.map(i=>trials[i].tau), n=ds.length;
  const mean=a=>a.reduce((p,c)=>p+c,0)/a.length;
  const sd=a=>{const m=mean(a);return Math.sqrt(a.reduce((p,c)=>p+(c-m)*(c-m),0)/(a.length-1));};
  const Dm=mean(ds),sD=sd(ds),uD=Math.hypot(U.D,sD);
  const tm=mean(ts),sT=sd(ts),uT=Math.hypot(U.tau,sT);
  const Vt=P.d/tm, uVt=Math.sqrt(Math.pow(U.d/tm,2)+Math.pow(P.d*uT/(tm*tm),2));
  const Ve=Dm*Math.sqrt(G/(2*P.H));
  const uVe=Math.sqrt(G/(2*P.H)*uD*uD+G*Dm*Dm/(8*Math.pow(P.H,3))*U.H*U.H);
  const err=(Vt-Ve)/Vt*100;
  return {n,Dm,sD,uD,tm,sT,uT,Vt,uVt,Ve,uVe,err};
}

/* Cambiar el montaje borra los lanzamientos: se avisa y se puede deshacer. */
let undo=null, pRaf=0;
function guardaUndo(){ if(recorded.length&&!undo) undo={P:Object.assign({},P),rec:recorded.slice(),seed,taus:recorded.map(i=>trials[i].tau)}; }
function avisaBorrado(){ if(!undo) return; const u=undo;
  Lab.ui.aviso('Cambiaste el montaje: se '+(u.rec.length===1?'borró 1 lanzamiento':'borraron '+u.rec.length+' lanzamientos')+'.',{
    accion:()=>{ undo=null; Object.assign(P,u.P); seed=u.seed; applyParams(); recorded=u.rec.slice(); recorded.forEach((i,j)=>{ trials[i].tau=u.taus[j]; }); refreshPage(); },
    alCerrar:()=>{ undo=null; }}); }
function applyParams(){ setBallSize(); resetData(); setView(lastView); if(curPage) applyScene(curPage.scene); if(page==='explore') xDraw(); avisaBorrado(); }
/* Todo control del panel (Lab.ui.montar) llega aquí con su id y su valor. */
const PK={pd:['d',1000],pH:['H',100],ph:['h',100]};
function onCtl(id,v){
  if(PK[id]){ guardaUndo(); P[PK[id][0]]=v/PK[id][1]; if(!pRaf) pRaf=requestAnimationFrame(()=>{ pRaf=0; applyParams(); }); }
  else if(id==='xth') xSet('th',v);
  else if(id==='xv0') xSet('v0',v);
  else if(id==='xt') xSet('type',v);
  else if(id==='xVec'){ XL.vec=v; xVectors(null); }
  else if(id==='xPred'){ XL.pred=v; xDraw(); }
  else if(id==='ax-x'||id==='ax-y'){ AX[id.slice(3)]=v?-1:1; drawStatic(true); refreshPage(); }
}
/* Ejes: el origen sigue en b; invertir un eje solo cambia signos, y el resultado para V₀ₓ es el mismo. */
function axesHTML(){
  return '<div class="pila">'+Lab.ui.interruptor({id:'ax-x',texto:'Invertir eje x (positivo hacia la izquierda)',activo:AX.x<0})+
    Lab.ui.interruptor({id:'ax-y',texto:'Invertir eje y (positivo hacia arriba)',activo:AX.y<0})+'</div>';
}
function eqHTML(){
  const sx=AX.x>0?'':'−', sy=AX.y>0?'':'−';
  return '<div class="eq"><span class="mx">x = '+sx+'V₀ₓ·t &nbsp;&nbsp; Vₓ = '+sx+'V₀ₓ</span><br><span class="my">y = '+sy+'½·g·t² &nbsp;&nbsp; V<sub>y</sub> = '+sy+'g·t</span><br>'+
    'Al llegar al piso: x = '+sx+'D, y = '+sy+'H<br>⇒ '+sy+'H = '+sy+'½·g·t² → t = √(2H/g)<br>⇒ '+sx+'D = '+sx+'V₀ₓ·t → V₀ₓ = D·√(g / 2H)</div>'+
    '<p class="small">'+(AX.x<0||AX.y<0?'Con los ejes invertidos cambian los signos de x, y, Vₓ o V<sub>y</sub>, pero al despejar se llega a la misma V₀ₓ.':'Prueba a invertir un eje: cambian los signos, no el resultado.')+'</p>';
}
function mountParams(){ const n=$('#nominal'); if(n) n.onclick=()=>{ guardaUndo(); Object.assign(P,NOM); applyParams(); refreshPage(); }; }
function paramsHTML(){ return `<fieldset class="params">
    <legend>Parámetros del montaje</legend>
    ${paramField('pd','Diámetro de la esfera','d',P.d*1000,LIM.d,1000,2,'mm','calibrador · el tiempo τ depende de d',NOM.d*1000)}
    ${paramField('pH','Altura de la mesa','H',P.H*100,LIM.H,100,1,'cm','cinta métrica · cambia el tiempo de vuelo',NOM.H*100)}
    ${paramField('ph','Altura de la rampa','h',P.h*100,LIM.h,100,1,'cm','desde donde se suelta la esfera hasta el borde · cambia V₀ₓ',NOM.h*100)}

/* ---------- tus cálculos: el estudiante ingresa sus resultados y la simulación los verifica ---------- */
const CF=[['D','Alcance promedio','D̄','m'],['T','Tiempo promedio','τ̄','s'],['Vt','V₀ₓ con la fotocompuerta','d / τ̄','m/s'],['Ve','V₀ₓ con la parábola','D̄·√(g/2H)','m/s']];
const {num,decs,cifras:sigFigs}=Lab.fisica;
function refs(){ const s=stats(); return {D:[s.Dm,s.uD],T:[s.tm,s.uT],Vt:[s.Vt,s.uVt],Ve:[s.Ve,s.uVe],err:Math.abs(s.err)}; }
function calcHTML(){
  const n=recorded.length, dis=n<5?'disabled':'';
  let h='<div class="calcf"><span class="h">MAGNITUD</span><span class="h">VALOR</span><span></span><span class="h">INCERT.</span><span></span>';
  CF.forEach(([k,lab,sym,un])=>{ const a=answers[k]||{};
    h+='<label class="lab" for="cf'+k+'">'+lab+' <span class="small">'+sym+'</span></label><input id="cf'+k+'" data-k="'+k+'" data-p="v" inputmode="decimal" value="'+(a.v||'')+'" '+dis+' aria-label="'+lab+'"><span class="pm">±</span><input data-k="'+k+'" data-p="u" inputmode="decimal" value="'+(a.u||'')+'" '+dis+' aria-label="Incertidumbre de '+lab+'"><span class="un">'+un+'</span><span class="msg" id="cm'+k+'"></span>'; });
  const e=answers.err||{};
  h+='<label class="lab" for="cferr">Porcentaje de error</label><input id="cferr" data-k="err" data-p="v" inputmode="decimal" value="'+(e.v||'')+'" '+dis+'><span></span><span></span><span class="un">%</span><span class="msg" id="cmerr"></span></div>';
  return '<p class="small">Escribe tus resultados en metros y segundos (puedes usar coma decimal). Cada incertidumbre con <b>una cifra significativa</b> y el valor redondeado a esa misma posición decimal.</p>'+h+
    '<div class="row"><button class="btn primary" data-principal id="verify" '+dis+'>Verificar mis cálculos</button><button class="btn" id="sol" '+dis+'>'+(showSol?'Ocultar':'Ver')+' la solución</button></div><div id="calcOut">'+(n<5?'<p class="small">Primero completa los cinco lanzamientos.</p>':'')+'</div><div id="solOut"></div>';
}
function verifyCalc(){
  const R=refs(); let ok=0, tot=0;
  CF.forEach(([k])=>{ const a=answers[k]||{}, [rv,ru]=R[k], pr=pair(rv,ru), d=decs(pr[1]), unit=Math.pow(10,-d);
    const iv=$('[data-k="'+k+'"][data-p="v"]'), iu=$('[data-k="'+k+'"][data-p="u"]'), m=$('#cm'+k);
    const v=num(a.v), u=num(a.u); let msg='', good=false, gu=false; tot++;
    if(v==null||u==null) msg='Falta el valor o la incertidumbre.';
    else if(sigFigs(a.u)!==1) msg='La incertidumbre va con una sola cifra significativa.';
    else if(Math.abs(u-num(pr[1]))>unit*1.01) msg='Revisa la incertidumbre: combina la lectura con la dispersión de la serie.';
    else { gu=true;
      if(decs(a.v)!==decs(a.u)) msg='Redondea el valor a la misma posición decimal que su incertidumbre.';
      else if(Math.abs(v-rv)>Math.max(ru,unit)) msg='Revisa el valor: no coincide con los datos de la tabla.';
      else { good=true; msg='Correcto.'; } }
    if(good) ok++;
    iv.className=v==null?'':(good?'ok':(gu&&!good?'bad':'')); iu.className=u==null?'':(gu?'ok':'bad'); if(!gu&&v!=null&&u!=null) iv.className='';
    m.className='msg '+(good?'ok':'bad'); m.textContent=msg; });
  const e=num((answers.err||{}).v), me=$('#cmerr'), ie=$('#cferr'); tot++;
  if(e==null){ me.className='msg bad'; me.textContent='Falta el porcentaje de error.'; ie.className=''; }
  else if(Math.abs(Math.abs(e)-R.err)<=Math.max(0.5,0.05*R.err)){ ok++; me.className='msg ok'; me.textContent='Correcto.'; ie.className='ok'; }
  else { me.className='msg bad'; me.textContent='Revisa: % = |V_foto − V_parábola| / V_foto × 100.'; ie.className='bad'; }
  did.calc=ok===tot; marcaPasos();
  $('#calcOut').innerHTML='<p>'+(ok===tot?'<span class="badge ok">'+ok+' de '+tot+'</span> ¡Todo bien! Tus resultados coinciden con los de la simulación.':'<span class="badge bad">'+ok+' de '+tot+'</span> Corrige lo marcado en rojo y vuelve a verificar.')+'</p>';
}
function solHTML(){ const R=refs(); return '<details open><summary>Solución con estos datos</summary>'+
  CF.map(([k,lab,sym,un])=>row(lab,sym,pair(R[k][0],R[k][1]).join(' ± ')+' '+un)).join('')+row('Porcentaje de error','|V_foto − V_parábola| / V_foto',fx(R.err,2)+' %')+'</details>'; }
function mountCalc(){
  document.querySelectorAll('.calcf input').forEach(i=>i.oninput=()=>{ const k=i.dataset.k; (answers[k]=answers[k]||{})[i.dataset.p]=i.value; });
  const v=$('#verify'); if(v) v.onclick=verifyCalc;
  const s=$('#sol'); if(s) s.onclick=()=>{ showSol=!showSol; s.textContent=(showSol?'Ocultar':'Ver')+' la solución'; $('#solOut').innerHTML=showSol?solHTML():''; };
  if(showSol&&recorded.length>=5) $('#solOut').innerHTML=solHTML();
}

/* ---------- Explorar: varios tipos de lanzamiento ---------- */
const XT={
  ramp:{n:'Rampa del montaje',k:'1',sh:'Rampa'},
  horiz:{n:'Horizontal desde la mesa',k:'2',sh:'Horizontal'},
  obl:{n:'Oblicuo desde la mesa',k:'3',sh:'Oblicuo'},
  floor:{n:'Desde el piso',k:'4',sh:'Desde el piso'}};
const XL={type:'obl',v0:2.0,th:35,vec:true,pred:true};
const xG=new THREE.Group(); scene.add(xG);
function xOrigin(){ return XL.type==='floor'?{x:0.02,y:0}:{x:0,y:P.H}; }      // centro de la esfera: y + RM
function xAngle(){ return XL.type==='horiz'?0:XL.th; }
function xKin(){ const o=xOrigin(), a=xAngle()*Math.PI/180, vx=XL.v0*Math.cos(a), vy=XL.v0*Math.sin(a);

    ['pointerup','pointercancel'].forEach(ev=>sc.addEventListener(ev,()=>{ drag=null; })); }
  const sel=$('#speed'), vel=$('#dkVel b');
  sel.onchange=()=>{ speed=parseFloat(sel.value); vel.textContent='×'+String(speed).replace('.',','); };
  $('#dkVel').onclick=()=>{ sel.selectedIndex=(sel.selectedIndex+1)%sel.options.length; sel.onchange(); };
  document.querySelectorAll('[data-z]').forEach(b=>b.onclick=()=>{ const k=b.dataset.z;
    if(k==='ey+') ey=Math.min(4,ey*1.25); else if(k==='ey-') ey=Math.max(0.4,ey/1.25);
    else if(k==='ex+') ex=Math.min(8,ex*1.4); else ex=Math.max(0.5,ex/1.4);
    drawScope(); });
  setBallSize(); genTrials(); buildPath(); drawStatic(); ballAt('a'); drawScope();
  document.querySelectorAll('.mode[data-app]').forEach(b=>b.onclick=()=>setApp(b.dataset.app));
  $('#bGuide').onclick=()=>{ guide=!guide; setApp('lab'); };
  document.querySelectorAll('[data-ui]').forEach(x=>x.onclick=()=>toggleUI(x.dataset.ui));
  $('#unclean').onclick=()=>toggleUI('clean');
  window.addEventListener('resize',hud);
  const enExp=f=>e=>{ if(app!=='explore') return false; f(e); };
  const lado=d=>e=>{
    if(app==='lab'&&guide){ const j=cur+d; if(j<0||j>=STEPS.length) return false; go(j); return; }
    if(app!=='explore') return false;
    if(XL.type!=='ramp'&&XL.type!=='horiz') xSet('th',XL.th+d*(e.shiftKey?5:1)); };
  const alto=d=>enExp(e=>{ const st=e.shiftKey?5:1; if(XL.type!=='ramp') xSet('v0',XL.v0+d*0.1*st); else cambiaRampa(d*0.01*st); });
  const tipo=k=>enExp(()=>xSet('type',k));
  Lab.ui.teclas({
    h:()=>toggleUI('clean'), p:()=>toggleUI('card'), s:()=>toggleUI('scope'), e:()=>toggleUI('labels'), l:()=>toggleUI('proyector'), o:()=>toggleUI('tema'),
    Escape:()=>{ if(!UI.clean) return false; toggleUI('clean'); },
    ' ':principalClick, Enter:principalClick,
    ArrowLeft:lado(-1), ArrowRight:lado(1), ArrowUp:alto(1), ArrowDown:alto(-1),
    '1':tipo('ramp'), '2':tipo('horiz'), '3':tipo('obl'), '4':tipo('floor'),
    v:enExp(()=>{ XL.vec=!XL.vec; refreshPage(); }), t:enExp(()=>{ XL.pred=!XL.pred; refreshPage(); }),
    c:enExp(()=>{ clearTransient(); trailN=0; trailGeo.setDrawRange(0,0); clear(G_('gDimD')); dirty=true; })});
  applyUI();
  setApp(/laboratorio/.test(location.hash)?'lab':'explore');
  window.addEventListener('resize',()=>{ drawScope(); layoutTop(); resize3D(); });
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(layoutTop);
  if(window.ResizeObserver) new ResizeObserver(drawScope).observe($('#scope'));
  /* Cambio de tema (botón, tecla O o el sistema): fondo y luces, y se repintan los rótulos y cotas, que son dibujos con el color de ese momento.
     La ventana del PhysicsSensor no cambia (es réplica del programa real). */
  Lab.ui.alCambiarTema(t=>{
    const cota=page==='explore'&&lastXK&&G_('gDimD').children.length>0;
    Lab.escena.ambiente(scene,t); projEls=null; drawStatic(true);
    if(xVec){ xVec.vx.setColor(tcol('--mag-x')); xVec.vy.setColor(tcol('--mag-y')); }
    xG.traverse(o=>{ if(o.type==='ArrowHelper') o.setColor(tcol('--mag-tray')); else if(o.userData.tk) o.material.color.set(sv(o.userData.tk)); });
    if(lastCfg) applyScene(lastCfg);
    if(cota) xDimD(lastXK);
    dirty=true;
  });
  document.querySelectorAll('.vb').forEach(b=>b.onclick=()=>setView(b.dataset.v));
  if(window.ResizeObserver) new ResizeObserver(resize3D).observe(view);
  resize3D(); setView('iso');
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>drawStatic(true));
})();
})();
</script>
