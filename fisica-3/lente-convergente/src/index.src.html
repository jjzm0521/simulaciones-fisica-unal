/* Magnitudes de esta práctica: objeto, imagen real, imagen o objeto virtual, focos y los tres rayos principales.
   El mismo color va en la escena, el diagrama, las lecturas y el texto. Contraste ≥ 4,5:1 como texto en cada tema. */
:root{--mag-obj:#A25600;--mag-real:#006F8F;--mag-virt:#6A3FD6;--mag-foc:#0A7A43;--mag-r1:#B36B00;--mag-r2:#1F2A44;--mag-r3:#D1432F}
html.oscuro{--mag-obj:#FFB454;--mag-real:#7FE3FF;--mag-virt:#C4B0FF;--mag-foc:#7DFFB0;--mag-r1:#FFD27A;--mag-r2:#FFFFFF;--mag-r3:#FF8F6B}
.c-obj{color:var(--mag-obj)} .c-real{color:var(--mag-real)} .c-virt{color:var(--mag-virt)} .c-foc{color:var(--mag-foc)}
.badge.c-obj,.badge.c-real,.badge.c-virt,.badge.c-foc{border-color:currentColor}
.badge.punteada{border-style:dashed}
/* rótulos sobre la escena (HTML: se leen igual a cualquier distancia) */
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.tag{position:absolute;left:0;top:0;display:flex;align-items:center;gap:var(--e-1);padding:1px var(--e-2);border-radius:var(--r-full);background:var(--panel);border:1px solid var(--line);font-size:var(--t-xs);font-weight:500;white-space:nowrap;color:var(--ink)}
.tag .d{width:8px;height:8px;border-radius:50%;flex:none}
.tag.dash .d{background:transparent!important;border:1.5px dashed currentColor}
.tag .m{font-family:var(--font-mono);color:var(--muted)}
.tag .m:empty{display:none}
.tag.minor{background:transparent;border-color:transparent;padding:0 var(--e-1)}
body.no-labels #labels{display:none}
#view canvas{touch-action:none;cursor:grab}
#view canvas.can{cursor:move}
/* lecturas sobre la escena + clasificación de la imagen */
.clasif{display:flex;flex-wrap:wrap;gap:var(--e-1);padding:var(--e-1) var(--e-1) 0}
/* lente en las opciones */
.opcion svg{width:26px;height:22px;flex:none;fill:currentColor;fill-opacity:.25;stroke:currentColor;stroke-width:1.2}
/* pantalla del laboratorio y gráfica dentro del panel */
.pantalla{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr);gap:var(--e-3);align-items:center}
.pantalla canvas{width:100%;aspect-ratio:1;border-radius:var(--r-2);border:1px solid var(--line);display:block}
.grafica{display:block;width:100%;height:220px}
#profWrap .eq{margin-top:var(--e-2);white-space:normal}
@media (max-width:760px){ .pantalla{grid-template-columns:110px minmax(0,1fr)} .clasif,.ventana-pie{display:none} }
</style>

<script>
(()=>{
'use strict';
/* ================= constantes y estado ================= */
/* Preferencias primero: ponen el tema (html.oscuro) antes de leer los colores y armar la escena. */
const CLAVE='lente-ui';
const UI=Lab.ui.cargarPreferencias(CLAVE,{scope:innerWidth>760});
/* Colores de lienzos y rayos: salen de los tokens (tokens.css y --mag-* de arriba) y se releen al cambiar de tema. */
const COL={};
const cssv=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const rgb=h=>{h=h.replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');const n=parseInt(h,16);return `${n>>16&255},${n>>8&255},${n&255}`;};
function leerColores(){
  const ink=cssv('--ink'),mut=cssv('--muted');
  Object.assign(COL,{obj:cssv('--mag-obj'),real:cssv('--mag-real'),virt:cssv('--mag-virt'),foc:cssv('--mag-foc'),ink,muted:mut,
    axis:`rgba(${rgb(mut)},.7)`,screen:`rgba(${rgb(ink)},.75)`,ext:cssv('--mag-virt'),rays:[cssv('--mag-r1'),cssv('--mag-r2'),cssv('--mag-r3')],
    grid:cssv('--line'),gridS:`rgba(${rgb(mut)},.8)`,plotAx:mut,label:ink,focLine:`rgba(${rgb(cssv('--mag-foc'))},.7)`,
    qR:rgb(cssv('--mag-real')),qV:rgb(cssv('--mag-virt')),halo:`rgba(${rgb(ink)},.35)`,halo0:`rgba(${rgb(ink)},0)`});
}
leerColores();
const FB="'IBM Plex Sans', system-ui, sans-serif", FM="'IBM Plex Mono', Menlo, monospace", FD="'Bricolage Grotesque', system-ui, sans-serif";
// En día los colores neón no se leen: cada color de la escena tiene su versión oscura.
const DAY3={0xffb454:0xc96f00,0xffc070:0xb85f00,0xffc982:0xd98a2b,0xffd9a0:0xb36b00,0x7fe3ff:0x0089b0,0xc4b0ff:0x6a3fd6,0xd6caff:0x5b33c4,0x7dffb0:0x0a8f4f,0xb4bed3:0x5a6680,0x8f9ab3:0x7a859c,
  0x2a3550:0xc6cedb,0x3c4c70:0xaeb8c9,0x070b14:0xe3e8ef,0x10141f:0x2a3244,0x1c2333:0x3b455c,0x0e121b:0x222938,0xb9c2cf:0x9aa4b3,0xe8f6ff:0xd8f0fa,0x070a12:0xf1f4f8};
let day=false;
const tc=c=>day?(DAY3[c]??c):c;
const Y0=14, AP=5, DL=2*AP;            // cm: altura del eje, radio y diámetro de la lente
const H=3, W=2.2;                      // cm: F luminosa del laboratorio
const XMIN=-110, XMAX=120, XIN=-105;   // cm
const RT=3;                            // cm: tope del riel
const F0=12, SCR=16;                   // cm: lente auxiliar L₀ (a 2f₀–2f₀), lado de la pantalla
const U_S=0.1, BLUR_OK=0.05;           // cm
const S={app:'explore',mode:'real',s:-50,h:4,c1:1/25,c2:-1/25,n:1.52,sv:12,xs:50,D:8,prec:1,beam:true,pr:true,ext:true,trail:true};
const LENSES=[
  {id:'bicx',name:'Biconvexa',c1:1/25,c2:-1/25,div:false},
  {id:'plcx',name:'Planoconvexa',c1:1/13,c2:0,div:false},
  {id:'mncx',name:'Menisco conv.',c1:1/10,c2:1/22,div:false},
  {id:'bicc',name:'Bicóncava',c1:-1/25,c2:1/25,div:true},
  {id:'plcc',name:'Planocóncava',c1:-1/13,c2:0,div:true},
  {id:'mncc',name:'Menisco div.',c1:1/22,c2:1/10,div:true},
];
const data={rows:[],finf:null};
let tab='map',dirty=true,lensDirty=true,focusAnim=null,autoRec=false;
const isLab=()=>S.app==='lab';

const $=id=>document.getElementById(id);
const fx=(x,d)=>(Number.isFinite(x)?x.toFixed(d).replace('.',','):'—');
const sg=(x,d)=>(Number.isFinite(x)?(x<0?'−':x>0?'+':'')+Math.abs(x).toFixed(d).replace('.',','):'∞');
function randn(){let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}

/* ================= óptica paraxial ================= */
const P=()=>(S.n-1)*(S.c1-S.c2);       // potencia, 1/cm
const fP=()=>{const p=P();return Math.abs(p)<1e-6?Infinity:1/p;};
const XL0=()=>S.sv-2*F0;
const XD=()=>S.mode==='virt'?XL0()-2*F0:S.s;   // display luminoso (Laboratorio)
function mainObj(){ // objeto para la lente principal: s (DIN) y altura y
  if(!isLab())return {s:S.s,y:S.h};
  if(S.mode==='inf')return {s:-S.D*100,y:.08*S.D*100};
  if(S.mode==='virt')return {s:S.sv,y:-H};     // imagen invertida de L₀ (β₀ = −1)
  return {s:S.s,y:H};
}
function image(){
  const o=mainObj(),inv=P()+1/o.s,sp=Math.abs(inv)<1e-6?Infinity:1/inv,b=Number.isFinite(sp)?sp/o.s:Infinity;
  return {s:o.s,y:o.y,sp,beta:b,yp:Number.isFinite(sp)?b*o.y:Infinity,real:Number.isFinite(sp)&&sp>0};
}
function elements(){const L={x:0,p:P(),R:AP};return isLab()&&S.mode==='virt'?[{x:XL0(),p:1/F0,R:3.5},L]:[L];}
function source(){ // punta del objeto físico (o, en Explorar con s > 0, el punto hacia el que converge el haz)
  if(isLab()&&S.mode==='virt')return {x:XD(),y:H,z:0};
  const o=mainObj();return {x:o.s,y:o.y,z:0};
}
function traceRay(src,yt,zt,els,xStart,xEnd){
  const x1=els[0].x;let uy=(yt-src.y)/(x1-src.x),uz=(zt-src.z)/(x1-src.x);
  let x=xStart,y=src.y+uy*(xStart-src.x),z=src.z+uz*(xStart-src.x);
  const pts=[[x,y,z]];
  for(const e of els){y+=uy*(e.x-x);z+=uz*(e.x-x);x=e.x;pts.push([x,y,z]);uy-=y*e.p;uz-=z*e.p;}
  y+=uy*(xEnd-x);z+=uz*(xEnd-x);pts.push([xEnd,y,z]);
  return {pts,uy,uz};
}
function bundle(src,xEnd,n){
  const els=elements(),r=els[0].R*.97,xStart=src.x<els[0].x?Math.max(src.x,XIN-40):XIN,rays=[];
  for(let k=0;k<n;k++){const a=2*Math.PI*k/n;rays.push(traceRay(src,r*Math.cos(a),r*Math.sin(a),els,xStart,xEnd));}
  return rays;
}
function onScreen(){ // mancha de la punta del objeto en la pantalla; m = escala de la F
  const rays=bundle(source(),S.xs,48);let cy=0,cz=0;
  rays.forEach(r=>{const p=r.pts[r.pts.length-1];cy+=p[1];cz+=p[2];});cy/=rays.length;cz/=rays.length;
  let d=0;rays.forEach(r=>{const p=r.pts[r.pts.length-1];d=Math.max(d,Math.hypot(p[1]-cy,p[2]-cz));});
  return {m:cy/H,blur:2*d};
}
const dof=sp=>BLUR_OK*Math.abs(sp)/DL;
const uSp=sp=>Math.sqrt(U_S*U_S+dof(sp)**2);
const sharpness=b=>Math.exp(-b/.12);
function xOut(im){ // hasta dónde se dibuja la luz que sale
  if(isLab())return S.xs;
  return im.real?Math.min(XMAX,Math.max(im.sp+18,im.sp*1.35)):70;
}
function principalRays(xEnd,xBegin){ // plano z = 0: rayo paralelo, por el centro y por F
  const im=image(),o=mainObj(),p=P(),f=fP(),defs=[];
  if(isLab()&&S.mode==='inf'){
    const a=o.y/o.s;
    [[0,COL.rays[1]],[a*f,COL.rays[2]],[-a*f*.9-AP*.45,COL.rays[0]]].forEach(([yl,c])=>defs.push({m:a,yl,c}));
  }else{
    defs.push({m:0,c:COL.rays[0]},{m:o.y/o.s,c:COL.rays[1]});
    if(Number.isFinite(f)&&Math.abs(o.s+f)>.4)defs.push({m:o.y/(o.s+f),c:COL.rays[2]});
    defs.forEach(d=>{d.yl=o.y-d.m*o.s;});
  }
  const x0=o.s<0&&!(isLab()&&S.mode==='inf')?o.s:(xBegin!==undefined?xBegin:(isLab()&&S.mode==='virt'?XL0()+.01:XIN));
  const out=[];
  for(const d of defs){
    const m2=d.m-d.yl*p,r={c:d.c,seg:[[x0,d.yl+d.m*x0],[0,d.yl],[xEnd,d.yl+m2*xEnd]],ext:[]};
    if(o.s>0)r.ext.push([[0,d.yl],[o.s,d.yl+d.m*o.s]]);
    if(Number.isFinite(im.sp)&&im.sp<0)r.ext.push([[0,d.yl],[im.sp,d.yl+m2*im.sp]]);
    out.push(r);
  }
  return out;
}
/* ================= escena ================= */
const renderer=new THREE.WebGLRenderer({antialias:true,stencil:true});
const canvas=renderer.domElement;$('view').appendChild(canvas);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.2;renderer.autoClear=false;renderer.setClearColor(0x04060c,1);
const scene=new THREE.Scene();scene.fog=new THREE.Fog(0x04060c,280,700);
const camera=new THREE.PerspectiveCamera(32,1,1,3000);
const hemi=new THREE.HemisphereLight(0x9fb8ff,0x1a1208,.7);scene.add(hemi);
const key=new THREE.DirectionalLight(0xffffff,1);key.position.set(40,120,90);scene.add(key);
const rim=new THREE.DirectionalLight(0x7fe3ff,.8);rim.position.set(-80,60,-120);scene.add(rim);
const objLight=new THREE.PointLight(0xffb454,0,110,1.7);scene.add(objLight);
const W3=(x,y,z=0)=>new THREE.Vector3(x,Y0+y,z);
const M={
  alu:new THREE.MeshStandardMaterial({color:0xb9c2cf,metalness:.85,roughness:.32}),
  dark:new THREE.MeshStandardMaterial({color:0x1c2333,metalness:.4,roughness:.55}),
  black:new THREE.MeshStandardMaterial({color:0x0e121b,metalness:.2,roughness:.6}),
  glowA:new THREE.MeshBasicMaterial({color:0xffb454}),
};
const mesh=(g,m)=>new THREE.Mesh(g,m);
const BL=()=>day?THREE.NormalBlending:THREE.AdditiveBlending;
const addMat=(color,op)=>new THREE.MeshBasicMaterial({color:tc(color),transparent:true,opacity:op,blending:BL(),depthWrite:false,toneMapped:false,side:THREE.DoubleSide});
function glowTex(){const cv=document.createElement('canvas');cv.width=cv.height=128;const c=cv.getContext('2d');const g=c.createRadialGradient(64,64,0,64,64,64);g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(.25,'rgba(255,255,255,.35)');g.addColorStop(1,'rgba(255,255,255,0)');c.fillStyle=g;c.fillRect(0,0,128,128);return new THREE.CanvasTexture(cv);}
const GT=glowTex();
function glow(color,size,op=1){const s=new THREE.Sprite(new THREE.SpriteMaterial({map:GT,color:tc(color),transparent:true,opacity:day?op*.35:op,blending:BL(),depthWrite:false,toneMapped:false}));s.scale.set(size,size,1);return s;}

/* ---------- mesa: piso con ejes (común a los dos modos) ---------- */
const floorL=[];
(function floor(){
  const base=mesh(new THREE.PlaneGeometry(700,420),new THREE.MeshStandardMaterial({color:0x070b14,roughness:.8,metalness:.15}));base.rotation.x=-Math.PI/2;scene.add(base);
  const baseL=mesh(new THREE.PlaneGeometry(350,420),base.material);baseL.rotation.x=-Math.PI/2;baseL.position.x=-175;floorL.push(baseL);
  const zone=(x0,x1,col)=>{const cv=document.createElement('canvas');cv.width=256;cv.height=4;const c=cv.getContext('2d');const g=c.createLinearGradient(0,0,256,0);
    const c0=col.replace(/[\d.]+\)$/,'0)');if(x0<0){g.addColorStop(0,c0);g.addColorStop(1,col);}else{g.addColorStop(0,col);g.addColorStop(1,c0);}c.fillStyle=g;c.fillRect(0,0,256,4);
    const m=mesh(new THREE.PlaneGeometry(x1-x0,70),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(cv),transparent:true,blending:THREE.AdditiveBlending,depthWrite:false}));m.rotation.x=-Math.PI/2;m.position.set((x0+x1)/2,.02,0);scene.add(m);if(x0<0){m.renderOrder=1;floorL.push(m);}};
  zone(XMIN,0,'rgba(255,180,84,.16)');zone(0,XMAX,'rgba(127,227,255,.14)');
  const pts=[],pts2=[];
  for(let x=-110;x<=120;x+=5)(x%10===0?pts2:pts).push(new THREE.Vector3(x,.04,-35),new THREE.Vector3(x,.04,35));
  for(let z=-35;z<=35;z+=5)(z%10===0?pts2:pts).push(new THREE.Vector3(XMIN,.04,z),new THREE.Vector3(XMAX,.04,z));
  scene.add(new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(pts),new THREE.LineBasicMaterial({color:0x2a3550,transparent:true,opacity:.4})));
  scene.add(new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(pts2),new THREE.LineBasicMaterial({color:0x3c4c70,transparent:true,opacity:.65})));
  const cut=[pts,pts2].map(p=>{const q=[];for(let i=0;i<p.length;i+=2){const a=p[i],b=p[i+1];if(Math.min(a.x,b.x)>0)continue;q.push(a,new THREE.Vector3(Math.min(b.x,0),b.y,b.z));}return q;});

function fitLine(xs,ys){
  const n=xs.length;if(n<2)return null;
  const mx=xs.reduce((a,b)=>a+b)/n,my=ys.reduce((a,b)=>a+b)/n;let sxx=0,sxy=0,syy=0;
  for(let i=0;i<n;i++){sxx+=(xs[i]-mx)**2;sxy+=(xs[i]-mx)*(ys[i]-my);syy+=(ys[i]-my)**2;}
  const m=sxy/sxx,b=my-m*mx;let ssr=0;for(let i=0;i<n;i++)ssr+=(ys[i]-m*xs[i]-b)**2;
  const s2=n>2?ssr/(n-2):NaN;return {m,b,um:Math.sqrt(s2/sxx),ub:Math.sqrt(s2*(1/n+mx*mx/sxx)),r2:1-ssr/syy,n};
}
const sig=u=>u>0?Math.max(0,1-Math.floor(Math.log10(u))):3;
function results(){
  const R={};
  if(data.rows.length>=2){const F=fitLine(data.rows.map(r=>100/r.s),data.rows.map(r=>100/r.sp));if(F){R.fit=F;if(F.b>0&&Number.isFinite(F.ub)){R.fg=100/F.b;R.ufg=100*F.ub/(F.b*F.b);}}}
  if(data.finf){R.finf=data.finf.v;R.ufinf=data.finf.u;}
  if(R.fg&&R.finf){R.err=Math.abs(R.finf-R.fg)/R.finf*100;R.nsig=Math.abs(R.finf-R.fg)/Math.hypot(R.ufg,R.ufinf);}

}

function aplicaTema(t){
  const d=t==='claro';day=d;leerColores();
  renderer.toneMapping=d?THREE.NoToneMapping:THREE.ACESFilmicToneMapping;
  const bg=new THREE.Color(Lab.escena.paleta(t).fondo);renderer.setClearColor(bg,1);scene.fog.color.copy(bg);L0Hole.color.copy(bg);
  hemi.color.setHex(d?0xffffff:0x9fb8ff);hemi.groundColor.setHex(d?0xd8dde6:0x1a1208);hemi.intensity=d?2.4:.7;
  key.intensity=d?1.4:1;rim.intensity=d?.3:.8;M.alu.metalness=d?.25:.85;
  // Los materiales guardan su color de noche; en día se cambian por su versión oscura (DAY3) y sin mezcla aditiva.
  const seen=new Set();
  const apply=m=>{if(!m||seen.has(m))return;seen.add(m);
    const n=m.userData.n||(m.userData.n={c:m.color?m.color.getHex():null,b:m.blending,o:m.opacity});
    if(m.userData.keep){m.needsUpdate=true;return;}
    if(n.c!==null)m.color.setHex(d?(DAY3[n.c]??n.c):n.c);
    m.blending=d&&n.b===THREE.AdditiveBlending?THREE.NormalBlending:n.b;
    m.opacity=d&&m.isSpriteMaterial?n.o*.35:n.o;m.needsUpdate=true;};
  scene.traverse(o=>{if(o.parent===beamG||o.parent===lensG)return;apply(o.material);});
  apply(lensMat);thruScene.traverse(o=>apply(o.material));L0Hole.color.copy(bg);
  lensDirty=dirty=true;dibujaPanel();
}

/* ---------- Tus cálculos ---------- */
const CF=[['b','Corte de la recta','b','m⁻¹','Sale de la regresión de 1/s′ contra 1/s.'],
  ['fg','Distancia focal (gráfica)','f′','cm','f′ = 100/b (b en m⁻¹) y u_f′ = 100·u_b / b².'],
  ['finf','Distancia focal (objeto en ∞)','f′∞','cm','Es la s′ que registraste con el objeto lejano.']];
const answers={},did={calc:false};let showSol=false;
function refs(){const R=results();return {b:[R.fit.b,R.fit.ub],fg:[R.fg,R.ufg],finf:[R.finf,R.ufinf],err:R.err};}
const calcListo=()=>data.rows.length>=3&&!!data.finf&&results().fg>0;
function calcHTML(){
  const dis=calcListo()?'':'disabled';
  let h='<div class="calcf"><span class="h">MAGNITUD</span><span class="h">VALOR</span><span></span><span class="h">INCERT.</span><span></span>';
  CF.forEach(([k,lab,sym,un])=>{const a=answers[k]||{};
    h+=`<label class="lab" for="cf${k}">${lab} <span class="small">${sym}</span></label><input id="cf${k}" data-k="${k}" data-p="v" inputmode="decimal" value="${a.v||''}" ${dis} aria-label="${lab}"><span class="pm">±</span><input data-k="${k}" data-p="u" inputmode="decimal" value="${a.u||''}" ${dis} aria-label="Incertidumbre de ${lab}"><span class="un">${un}</span><span class="msg" id="cm${k}"></span>`;});
  const e=answers.err||{};
  h+=`<label class="lab" for="cferr">Porcentaje de error</label><input id="cferr" data-k="err" data-p="v" inputmode="decimal" value="${e.v||''}" ${dis}><span></span><span></span><span class="un">%</span><span class="msg" id="cmerr"></span></div>`;
  return `<p>Con tu tabla haz la regresión de 1/s′ contra 1/s (en m⁻¹) y escribe tus resultados. Cada incertidumbre con <b>una cifra significativa</b> y el valor redondeado a esa misma posición decimal; puedes usar coma.</p>${tablaHTML(false)}${h}
    <div class="row"><button class="btn primary" type="button" data-principal id="verify" ${dis}>Verificar mis cálculos</button><button class="btn" type="button" id="sol" ${dis}>${showSol?'Ocultar':'Ver'} la solución</button></div>
    <div id="calcOut">${calcListo()?'':'<p class="small">Primero registra f′∞ y al menos 3 distancias (la guía pide 5).</p>'}</div><div id="solOut">${showSol&&calcListo()?solHTML():''}</div>`;
}
function verifyCalc(){
  const R=refs();let ok=0,tot=0;
  CF.forEach(([k,,,,pista])=>{const a=answers[k]||{},[rv,ru]=R[k],pr=pair(rv,ru),d=decs(pr[1]),unit=Math.pow(10,-d);
    const iv=document.querySelector(`[data-k="${k}"][data-p="v"]`),iu=document.querySelector(`[data-k="${k}"][data-p="u"]`),m=$('cm'+k);
    const v=num(a.v),u=num(a.u);let msg='',good=false,gu=false;tot++;
    if(v==null||u==null)msg='Falta el valor o la incertidumbre.';
    else if(cifras(a.u)!==1)msg='La incertidumbre va con una sola cifra significativa.';
    else if(Math.abs(u-num(pr[1]))>unit*1.01)msg='Revisa la incertidumbre. '+pista;
    else{gu=true;
      if(decs(a.v)!==decs(a.u))msg='Redondea el valor a la misma posición decimal que su incertidumbre.';
      else if(Math.abs(v-rv)>Math.max(ru,unit))msg='Revisa el valor. '+pista;
      else{good=true;msg='Correcto.';}}
    if(good)ok++;
    iv.className=v==null?'':(good?'ok':(gu?'bad':''));iu.className=u==null?'':(gu?'ok':'bad');
    m.className='msg '+(good?'ok':'bad');m.textContent=msg;});
  const e=num((answers.err||{}).v),me=$('cmerr'),ie=$('cferr');tot++;
  if(e==null){me.className='msg bad';me.textContent='Falta el porcentaje de error.';ie.className='';}
  else if(Math.abs(Math.abs(e)-R.err)<=Math.max(.3,.1*R.err)){ok++;me.className='msg ok';me.textContent='Correcto.';ie.className='ok';}
  else{me.className='msg bad';me.textContent='Revisa: % = |f′∞ − f′graf| / f′∞ × 100.';ie.className='bad';}
  did.calc=ok===tot;marcaPasos();
  $('calcOut').innerHTML='<p>'+(ok===tot?`<span class="badge ok">${ok} de ${tot}</span> ¡Todo bien! Tus resultados coinciden con los de la simulación.`:`<span class="badge bad">${ok} de ${tot}</span> Corrige lo marcado en rojo y vuelve a verificar.`)+'</p>';
}
function solHTML(){const R=refs();return '<details open><summary>Solución con estos datos</summary>'+
  CF.map(([k,lab,sym,un])=>fila(lab,sym,pair(R[k][0],R[k][1]).join(' ± ')+' '+un)).join('')+fila('Porcentaje de error','|f′∞ − f′graf| / f′∞',fx(R.err,2)+' %')+'</details>';}
function mountCalc(){
  document.querySelectorAll('.calcf input').forEach(i=>i.oninput=()=>{const k=i.dataset.k;(answers[k]=answers[k]||{})[i.dataset.p]=i.value;});

function focus(){
  const im=image(),ar=autoRec;autoRec=false;
  if(!Number.isFinite(im.sp)){Lab.ui.aviso('La imagen está en el infinito: el objeto está justo en el foco.');return;}
  if(!im.real){Lab.ui.aviso('La imagen es <b>virtual</b>: los rayos no se cruzan y no hay dónde poner la pantalla. Mira por la lente.');goView('eye');return;}
  if(im.sp>115){Lab.ui.aviso('La imagen real queda fuera del riel. Aleja el objeto.');return;}
  focusAnim={from:S.xs,to:Math.min(115,Math.max(2,im.sp+randn()*dof(im.sp)*S.prec*.6)),k:0};autoRec=ar;

function record(){
  scrInfo=onScreen();const im=image(),sh=sharpness(scrInfo.blur);
  if(S.mode==='virt'){Lab.ui.aviso('La tabla es para objeto real u objeto en ∞.');return;}
  if(!im.real){Lab.ui.aviso('No hay imagen en la pantalla: con el objeto dentro de f′ la imagen es virtual.');return;}
  if(sh<.8){Lab.ui.aviso('La imagen está borrosa (nitidez menor que 80 %). Mueve la pantalla hasta verla nítida antes de anotar s′.');return;}
  const sp=Math.round(S.xs*10)/10,u=Math.max(U_S,Math.round(uSp(sp)*10)/10);
  if(S.mode==='inf'){const prev=data.finf;data.finf={v:sp,u,D:S.D};refreshData();repinta();
    Lab.ui.aviso(`Registrado: f′∞ = ${fx(sp,1)} cm.`,prev?{accion:()=>{data.finf=prev;refreshData();repinta();}}:{});return;}
  const s=Math.round(S.s*10)/10;
  if(data.rows.some(r=>Math.abs(r.s-s)<2)){Lab.ui.aviso('Ya hay un dato con casi la misma distancia. Separa los puntos 5 o 10 cm.');return;}
  const r={s,us:U_S,sp,usp:u};data.rows.push(r);data.rows.sort((a,b)=>a.s-b.s);data.fresh=r;
  refreshData();if(app()==='lab'&&guide)repinta();
  Lab.ui.aviso(`Registrado: s = ${sg(s,1)} cm, s′ = ${fx(sp,1)} cm.`,{accion:()=>{data.rows.splice(data.rows.indexOf(r),1);refreshData();repinta();}});

const whyHTML=()=>'<div class="mini"><b>Qué está pasando</b><span id="why"></span></div>';
const EXPLORE={title:'¿Dónde se forma la imagen?',render:()=>`<p>Arrastra la flecha del objeto, también detrás de la lente, y mira a dónde se va la imagen. Nada se califica.</p>${whyHTML()}
  <fieldset class="params"><legend>Objeto</legend>${Lab.ui.deslizador({id:'s',etiqueta:'Posición del objeto',simbolo:'s',valor:S.s,min:-100,max:70,paso:.5,dec:1,unidad:'cm',teclas:'← →',nota:'Negativa: delante de la lente (real). Positiva: detrás (virtual).'})}
    <div class="row">${CASES.map(([k,t])=>`<button class="btn" type="button" data-case="${k}">${t}</button>`).join('')}</div>
    <div class="row"><button class="btn primary" type="button" data-principal id="go">${sweep?'Pausa':'Recorrer'}</button><button class="btn discreto" type="button" id="bTrail">Borrar estela</button></div></fieldset>
  <fieldset class="params"><legend>Lente</legend>${lenteHTML()}</fieldset>
  <fieldset class="params"><legend>Qué dibujar</legend><div class="row">${MOSTRAR.map(([k,t,tec])=>Lab.ui.casilla({id:k,texto:t,marcado:S[k],tecla:tec})).join('')}</div></fieldset>
  <details><summary>Ideas para probar</summary><ul class="tight">
    <li>Acerca el objeto a F desde lejos: ¿qué le pasa a la imagen justo al cruzar F?</li>
    <li>Pon el objeto en 2F: ¿de qué tamaño sale la imagen?</li>
    <li>Cambia a una lente divergente: ¿puedes lograr una imagen real con un objeto real?</li>
    <li>Pasa el objeto detrás de la lente (virtual) y mira el mapa s′–s.</li>
    <li>Cambia el material: ¿por qué el diamante enfoca tan cerca?</li></ul></details>
  <details><summary>Convención de signos (DIN 1335)</summary>${SIGNOS}</details>`,
  mount(){$('go').onclick=recorrer;$('bTrail').onclick=()=>{trail.length=0;dirty=true;};
    document.querySelectorAll('#card [data-case]').forEach(b=>b.onclick=()=>{stopSweep();const f=Math.abs(fP()),F=Number.isFinite(f)?Math.min(f,40):20;
      moveAnim={from:S.s,to:{far:-3*F,'2f':-2*F,proj:-1.5*F,lupa:-.55*F,virt:Math.min(.6*F,40)}[b.dataset.case],k:0};});}};

/* medir: qué ve y qué puede hacer el estudiante. tipo: 'libre' | 'ejemplo' | 'estudiante' | 'virt' */
function medirHTML(tipo){
  const virt=S.mode==='virt',inf=S.mode==='inf',enfocar=tipo!=='estudiante';
  const pos=inf?'':virt?Lab.ui.deslizador({id:'pos',etiqueta:'Objeto virtual (lo pone L₀)',simbolo:'s',valor:S.sv,min:2,max:2*F0-3,paso:.1,dec:1,unidad:'cm',teclas:'← →'}):
    Lab.ui.deslizador({id:'pos',etiqueta:'Objeto luminoso',simbolo:'s',valor:S.s,min:-100,max:-2,paso:.1,dec:1,unidad:'cm',teclas:'← →'});
  const principal=virt||tipo==='ejemplo'?(tipo==='ejemplo'?'Enfocar y registrar':'Enfocar'):'Registrar';
  return `<fieldset class="params"><legend>${inf?'Objeto lejano y pantalla':'Objeto y pantalla'}</legend>${pos}
    ${Lab.ui.deslizador({id:'xs',etiqueta:'Pantalla',simbolo:'x',valor:S.xs,min:2,max:115,paso:.1,dec:1,unidad:'cm',teclas:'↑ ↓',nota:'Arrástrala en la escena o muévela aquí.'})}
    <div class="pantalla"><canvas id="scrCv" aria-label="Lo que se ve en la pantalla"></canvas>${Lab.ui.lecturas([{id:'lNit',etiqueta:'Nitidez'},{id:'lLee',etiqueta:'Pantalla en la cinta'}],'Pantalla')}</div>
    <div class="row"><button class="btn primary" type="button" data-principal id="${principal==='Registrar'?'rec':'foc'}">${principal}</button>${principal==='Registrar'&&enfocar?'<button class="btn" type="button" id="foc">Enfocar · F</button>':''}<button class="btn discreto" type="button" id="rst">Reiniciar · R</button></div></fieldset>`;
}
function mountMedir(tipo){
  const r=$('rec'),f=$('foc');if(r)r.onclick=record;
  if(f)f.onclick=tipo==='ejemplo'?()=>{autoRec=true;focus();}:focus;
  const z=$('rst');if(z)z.onclick=reset;
}
const objetoHTML=()=>Lab.ui.opciones({id:'modo',etiqueta:'Qué objeto',valor:S.mode,items:[{v:'real',texto:'Objeto real',tecla:'1'},{v:'inf',texto:'Objeto en ∞',tecla:'3'},{v:'virt',texto:'Objeto virtual',tecla:'2'}]});
const avanzadoHTML=()=>`<details><summary>Objeto lejano y enfoque</summary>${Lab.ui.deslizador({id:'D',etiqueta:'Distancia del objeto lejano',valor:S.D,min:2,max:40,paso:.5,dec:1,unidad:'m'})}
  ${Lab.ui.deslizador({id:'Pr',etiqueta:'Error al enfocar',valor:S.prec,min:0,max:4,paso:.1,dec:1,unidad:'×'})}<p class="small">El "infinito" del laboratorio está a pocos metros, así que la imagen queda un poco más lejos que f′.</p></details>`;
const LABFREE={title:'La lente convergente',render:()=>`<p>Mide la distancia focal de dos formas: con un objeto lejano y con la gráfica 1/s′ contra 1/s. La f′ de la lente no se da: es lo que mides.</p>
  ${objetoHTML()}${whyHTML()}${medirHTML('libre')}${tablaHTML()}<h3>Gráfica 1/s′ vs 1/s</h3>${graficaHTML()}<h3>Resultados</h3><div id="res">${resultadosHTML()}</div>${avanzadoHTML()}${monitorHTML()}`,
  mount(){mountMedir('libre');}};
const visto=new Set();
const STEPS=[
  {label:'Montaje',title:'El montaje y los signos',enter:()=>setMode('real'),
   render:()=>`<p>Objeto luminoso (una <b class="c-obj">F</b>), lente y pantalla sobre un riel con cinta métrica. Todo se mide <b>desde la lente</b>, positivo hacia donde va la luz.</p>${SIGNOS}<p class="small">Arrastra el objeto o la pantalla sobre el riel, o usa los deslizadores del siguiente paso.</p><div class="row"><button class="btn primary" type="button" data-principal id="sv">Ver de lado</button></div>`,
   mount(){$('sv').onclick=()=>goView(view==='side'?'persp':'side');},hecho:()=>visto.has(0)},
  {label:'Objeto en ∞',title:'f′ con un objeto lejano',enter:()=>{setMode('inf');goView('persp');},
   render:()=>`<p>Un objeto muy lejano manda rayos casi paralelos: la imagen se forma cerca del foco y <b>s′ ≈ f′</b>. Este es el ejemplo resuelto: la simulación enfoca la pantalla y anota s′.</p>${medirHTML('ejemplo')}${data.finf?fila('Distancia focal f′∞','s′ leída en la cinta',pm(data.finf.v,data.finf.u)+' cm',true):''}`,
   mount(){mountMedir('ejemplo');},hecho:()=>!!data.finf},
  {label:'Tomar datos',title:'Imagen real de un objeto real',enter:()=>{setMode('real');if(S.s>-fP()*1.3)setPos(-fP()*2.2);},
   render:()=>`<p>Ahora mides tú. Pon el objeto, mueve la pantalla hasta que la <b class="c-obj">F</b> se vea nítida (nitidez de 80 % o más) y registra. Haz <b>5 distancias</b> separadas 5 o 10 cm.</p>${medirHTML('estudiante')}${tablaHTML()}`,
   mount(){mountMedir('estudiante');},hecho:()=>data.rows.length>=5},
  {label:'Gráfica',title:'Gráfica 1/s′ vs 1/s',
   render:()=>`<p>De 1/s′ − 1/s = 1/f′ sale una recta de <b>pendiente 1</b> y corte <b class="c-foc">b = 1/f′</b>. Las barras son las incertidumbres de cada punto.</p>${graficaHTML()}`,hecho:()=>data.rows.length>=3},
  {label:'Tus cálculos',title:'Tus cálculos',render:()=>calcHTML(),mount:mountCalc,hecho:()=>did.calc},
  {label:'Resultados',title:'Comparar las dos f′',
   render:()=>`<p>Compara la f′ de la gráfica con f′∞. Si el objeto lejano no está suficientemente lejos, f′∞ sale un poco mayor.</p><div id="res">${resultadosHTML()}</div>${avanzadoHTML()}${monitorHTML()}`,hecho:()=>results().err!==undefined},
  {label:'Imagen virtual',title:'Imagen virtual (lupa)',enter:()=>{setMode('real');setPos(-fP()*.6);goView('eye');},
   render:()=>`<p>Con el objeto dentro de F la imagen es <b class="c-virt">virtual</b>: la pantalla no la recoge, pero mirando <b>a través de la lente</b> se ve la <b class="c-obj">F</b> derecha y mayor.</p><p>Por la lente cambia todo lo que está detrás de ella: panel, riel y piso. Aleja el objeto: todo se voltea cuando la imagen real se forma delante del ojo.</p>${whyHTML()}
     ${Lab.ui.deslizador({id:'pos',etiqueta:'Objeto luminoso',simbolo:'s',valor:S.s,min:-100,max:-2,paso:.1,dec:1,unidad:'cm',teclas:'← →'})}
     <div class="row"><button class="btn primary" type="button" data-principal id="ojo">${view==='eye'?'Ver de lado':'Mirar por la lente'}</button></div>`,
   mount(){$('ojo').onclick=()=>{goView(view==='eye'?'side':'eye');$('ojo').textContent=view==='eye'?'Ver de lado':'Mirar por la lente';};},hecho:()=>visto.has(6)&&S.mode==='real'&&image().sp<0},
  {label:'Objeto virtual',title:'Objeto virtual',enter:()=>{setMode('virt');goView('side');},
   render:()=>`<p>La lente auxiliar L₀ forma un haz que iba a juntarse detrás de la lente: ese punto es un <b class="c-virt">objeto virtual</b> (s &gt; 0). La lente adelanta el cruce y la imagen sale <b class="c-real">real</b>.</p>${whyHTML()}${medirHTML('virt')}`,
   mount(){mountMedir('virt');},hecho:()=>S.mode==='virt'&&sharpness(scrInfo.blur)>.8},
];
let guide=true,cur=0;
const app=()=>S.app;
function pinta(st,kicker,pager){
  $('card').innerHTML=`<p class="kicker">${kicker}</p><h2>${st.title}</h2>${st.render()}`+(pager?`<div class="pager"><button class="btn" type="button" id="prev" ${cur===0?'disabled':''}>← Anterior</button><button class="btn" type="button" id="next" ${cur===STEPS.length-1?'disabled':''}>Siguiente →</button></div>`:'');
  if(pager){$('prev').onclick=()=>go(cur-1);$('next').onclick=()=>go(cur+1);}
  if(st.mount)st.mount();Lab.ui.montar('#card',alCambiar);bindData();
  syncLensUI();const fi=$('fit');if(fi)fi.innerHTML=fitHTML(results());
  dirty=true;updateHUD();requestAnimationFrame(dibujaPanel);
}
function go(i){cur=Math.max(0,Math.min(STEPS.length-1,i));visto.add(cur);const st=STEPS[cur];enPaso=true;if(st.enter)st.enter();enPaso=false;
  pinta(st,`Paso ${cur+1} de ${STEPS.length}`,true);
  document.querySelectorAll('#steps button').forEach((b,j)=>j===cur?b.setAttribute('aria-current','step'):b.removeAttribute('aria-current'));marcaPasos();}
let enPaso=false;
/* vuelve a pintar la página actual (sin volver a entrar al paso) */
function repinta(){if(enPaso)return;if(app()==='explore')pinta(EXPLORE,'Modo explorar');else if(guide)pinta(STEPS[cur],`Paso ${cur+1} de ${STEPS.length}`,true);else pinta(LABFREE,'Modo laboratorio');}
function marcaPasos(){document.querySelectorAll('#steps button').forEach((b,j)=>{const h=STEPS[j].hecho();b.classList.toggle('done',visto.has(j)&&h);b.classList.toggle('seen',visto.has(j)&&!h&&j!==cur);});}
function setApp(a,instant){
  stopSweep();focusAnim=null;
  if(a==='lab'){
    if(P()<=0){S.c1=1/25;S.c2=-1/25;lensDirty=true;Lab.ui.aviso('El laboratorio usa una lente convergente: se puso una biconvexa.');}
    if(S.s>=0)S.s=-50;
    const im=(()=>{const inv=P()+1/S.s;return Math.abs(inv)<1e-6?Infinity:1/inv;})();
    S.xs=Number.isFinite(im)&&im>2&&im<115?Math.min(115,im+8):50;
  }
  S.app=a;
  document.querySelectorAll('.mode[data-app]').forEach(b=>b.classList.toggle('on',b.dataset.app===a));
  $('bGuide').hidden=a!=='lab';$('bGuide').setAttribute('aria-checked',String(guide));
  const nav=a==='lab'&&guide;document.body.classList.toggle('navon',nav);$('steps').closest('nav').hidden=!nav;
  pintaVivo();pintaVistas();
  try{history.replaceState(null,'',a==='lab'?'#laboratorio':'#explorar');}catch(e){}
  if(a==='explore')pinta(EXPLORE,'Modo explorar');else if(guide)go(cur);else pinta(LABFREE,'Modo laboratorio');
  setTabV(tabV);placeAll();Lab.ui.ubicarBarras();resize();goView('persp',instant);
}

/* Todo control del panel llega aquí (Lab.ui.montar). */
function alCambiar(id,v){
  if(id==='s'){stopSweep();setPos(v,S.h);}
  else if(id==='pos'){focusAnim=null;setPos(v);}
  else if(id==='xs'){focusAnim=null;setScr(v);}
  else if(id==='modo')setMode(v);
  else if(id==='lente'){const l=LENSES.find(x=>x.id===v);cambiaLente(()=>{S.c1=l.c1;S.c2=l.c2;});}
  else if(id==='c1'||id==='c2'){const c=Math.abs(v)<.6?0:v/100;cambiaLente(()=>{S[id]=c;});}
  else if(id==='n')cambiaLente(()=>{S.n=+v;});
  else if(id==='D'){S.D=v;dirty=true;}
  else if(id==='Pr')S.prec=v;
  else if(id in S&&typeof v==='boolean'){S[id]=v;dirty=true;}
}

/* ================= qué mostrar, teclado y barra táctil ================= */
function aplicaUI(){
  Lab.ui.aplicarClases(UI);Lab.ui.guardarPreferencias(CLAVE,UI);
  document.body.classList.toggle('no-labels',!UI.labels);renderer.toneMappingExposure=UI.proyector?1.5:1.2;
  Lab.ui.ubicarBarras();resize();actualizarBarra();
}
function alterna(k){if(k==='tema'){Lab.ui.alternarTema(UI);aplicaUI();return;}UI[k]=!UI[k];if(k!=='clean')UI.clean=false;aplicaUI();if(['card','scope','clean'].includes(k)&&(view==='persp'||view==='side'))goView(view);}
Lab.ui.alCambiarTema(t=>aplicaTema(t));
const principal=()=>{const b=Lab.ui.principal();if(!b||b.disabled)return false;b.click();};
const barra=Lab.ui.barraAccion({pad:'#pad',hud:'#hud',accion:a=>{
  if(a==='principal')principal();else if(a==='s-')moverObj(-1);else if(a==='s+')moverObj(1);else if(a==='x-')moverPantalla(-.5);else if(a==='x+')moverPantalla(.5);}});
function actualizarBarra(){
  const sinPanel=UI.clean||!UI.card,tac=Lab.ui.esTactil(),lab=isLab(),b=Lab.ui.principal(),im=image();
  const g=[];if(!(lab&&S.mode==='inf'))g.push({id:'s',menos:'s−',mas:'s+',nombre:'la posición del objeto'});if(lab)g.push({id:'x',menos:'P−',mas:'P+',nombre:'la pantalla'});
  barra.pintar({pad:tac&&sinPanel,hud:!tac&&sinPanel,
    valores:[lab&&S.mode==='inf'?'s = −∞':'s = '+sg(lab&&S.mode==='virt'?S.sv:S.s,1)+' cm'].concat(lab?['pantalla '+fx(S.xs,1)+' cm','nitidez '+(im.real?fx(sharpness(scrInfo.blur)*100,0)+' %':'—')]:['s′ = '+(Number.isFinite(im.sp)?sg(im.sp,1)+' cm':'∞')]),
    grupos:g,principal:{texto:b?b.textContent:'—',inactivo:!b||b.disabled},
    teclas:[['Espacio',b?b.textContent.toLowerCase():'—'],['← →','objeto']].concat(lab?[['↑ ↓','pantalla'],['F','enfocar']]:[['↑ ↓','altura']],[['H','paneles']])});
}
const enLab=f=>()=>{if(!isLab())return false;f();};
const pasoEstudiante=()=>isLab()&&guide&&cur===2;
Lab.ui.teclas({h:()=>alterna('clean'),p:()=>alterna('card'),s:()=>alterna('scope'),e:()=>alterna('labels'),l:()=>alterna('proyector'),o:()=>alterna('tema'),
  Escape:()=>{if(!UI.clean)return false;alterna('clean');},' ':principal,Enter:principal,
  ArrowLeft:()=>moverObj(-1),ArrowRight:()=>moverObj(1),
  ArrowUp:()=>{if(isLab())moverPantalla(.5);else{stopSweep();setPos(S.s,S.h+.5);}},ArrowDown:()=>{if(isLab())moverPantalla(-.5);else{stopSweep();setPos(S.s,S.h-.5);}},
  f:enLab(()=>{if(pasoEstudiante()){Lab.ui.aviso('En este paso enfocas tú: mueve la pantalla hasta ver la F nítida.');return;}focus();}),
  r:enLab(reset),'1':enLab(()=>setMode('real')),'2':enLab(()=>setMode('virt')),'3':enLab(()=>setMode('inf')),
  g:enLab(()=>{guide=!guide;setApp('lab');}),
  t:()=>{if(isLab())return false;S.trail=!S.trail;Lab.ui.marcar('trail',S.trail);dirty=true;},
  v:()=>{const ks=viewsFor();goView(ks[(ks.indexOf(view)+1)%ks.length]);}});

/* ================= distribución y bucle ================= */
const viewEl=$('view');
function resize(){
  const w=viewEl.clientWidth,h=viewEl.clientHeight;if(!w||!h)return;
  renderer.setSize(w,h,false);camera.aspect=w/h;
  const wide=innerWidth>760,card=$('card'),side=wide&&UI.card&&!UI.clean?card.offsetWidth+24:0;let left=wide&&!UI.clean?84:0;
  let topH=0,botH=0;
  if(!UI.clean){const vv=$('vivo').getBoundingClientRect();topH=wide?vv.bottom:Math.max(vv.bottom,$('viewbtns').getBoundingClientRect().bottom);
    const ve=$('ventana');if(wide&&UI.scope&&ve.getClientRects().length){botH=innerHeight-ve.getBoundingClientRect().top;left+=ve.offsetWidth*.4;}}
  const pd=$('pad');if(pd&&!pd.hidden)botH=Math.max(botH,pd.offsetHeight+12);
  const oy=Math.round((Math.min(botH,h*.6)-Math.min(topH,h*.3))/2);
  if(side||left||oy)camera.setViewOffset(w,h,(side-left)/2,oy,w,h);else camera.clearViewOffset();
  camera.updateProjectionMatrix();dirty=true;dibujaPanel();
}
new ResizeObserver(resize).observe(viewEl);
addEventListener('resize',()=>{const was=camera.aspect<.9;Lab.ui.ubicarBarras();resize();if((camera.aspect<.9)!==was)goView(view);});
let last=performance.now(),tt=0,nf=0;
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;tt+=dt;
  if(sweep){const f=fP();let x=S.s+sweep.dir*dt*14*(Number.isFinite(f)&&Math.abs(S.s+f)<6?.45:1);if(x>45){x=45;sweep.dir=-1;}if(x<-95){x=-95;sweep.dir=1;}if(Math.abs(x)<1.3)x=sweep.dir>0?1.3:-1.3;setPos(x,S.h);}
  if(moveAnim){const a=moveAnim;a.k=Math.min(1,a.k+dt/1.2);const e=a.k<.5?2*a.k*a.k:1-Math.pow(-2*a.k+2,2)/2;setPos(a.from+(a.to-a.from)*e,S.h);if(a.k>=1)moveAnim=null;}
  if(focusAnim){const a=focusAnim;a.k=Math.min(1,a.k+dt/.9);const e=a.k<.5?2*a.k*a.k:1-Math.pow(-2*a.k+2,2)/2;setScr(a.from+(a.to-a.from)*e);
    if(a.k>=1){focusAnim=null;if(autoRec){autoRec=false;scrInfo=onScreen();record();}else Lab.ui.aviso('Imagen enfocada: lee s′ en la cinta y registra.');}}
  if(dirty){placeAll();syncLabUI();}
  const br=.5+.5*Math.sin(tt*2.4);
  virtA.mat.opacity=.5+.3*br;vObjA.mat.opacity=.5+.3*br;virtA.aMat.opacity=vObjA.aMat.opacity=.14+.14*br;virtA.gl.material.opacity=vObjA.gl.material.opacity=(.4+.3*br)*(day?.35:1);
  objGlow.material.opacity=.5+.05*Math.sin(tt*3.1);
  if(isLab()){const eye=view==='eye'&&!camAnim;beamG.visible=!eye;scrG.visible=!eye;vObjF.visible=S.mode==='virt'&&S.ext&&!eye;}else beamG.visible=true;
  drawTrail();pasoCam(dt);renderAll();updateTags();if(++nf%15===0)marcaPasos();
  requestAnimationFrame(frame);
}

/* ================= arranque ================= */
STEPS.forEach((s,i)=>{const li=document.createElement('li'),b=document.createElement('button');b.type='button';b.innerHTML=`<span class="n">${i+1}</span><span>${s.label}</span>`;b.onclick=()=>go(i);li.appendChild(b);$('steps').appendChild(li);});
document.querySelectorAll('.mode[data-app]').forEach(b=>b.onclick=()=>setApp(b.dataset.app));
$('bGuide').onclick=()=>{guide=!guide;setApp('lab');};
document.querySelectorAll('[data-ui]').forEach(b=>b.onclick=()=>alterna(b.dataset.ui));
$('unclean').onclick=()=>alterna('clean');
if(innerWidth<=760)UI.scope=false;   // en celular la ventana empieza cerrada: la escena es pequeña
aplicaTema(Lab.ui.tema());aplicaUI();
camera.position.set(0,Y0+60,200);controls.target.set(0,Y0,0);
setApp(/laboratorio/.test(location.hash)?'lab':'explore',true);
setTabV('rayos');
document.fonts&&document.fonts.ready.then(()=>{resize();dirty=true;});
requestAnimationFrame(frame);
window.__lens={S,data,image,results,setApp,setMode,setPos,setScr,focus,record,goView,setTabV,P,fP,trail,onScreen:()=>scrInfo,sharpness,camera,controls,UI,go};
})();
</script>
</body></html>
