<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nombre de la práctica</title>
<!-- PLANTILLA DE PRÁCTICA · diseño aprobado (F1 y F3). Copia esta carpeta a fisica-N/<practica>/ y cambia lo marcado con TODO.
     Empaquetar desde la carpeta de la práctica:  python3 -I ../../herramientas/empaquetar.py src/index.src.html index.html
     (desde plantilla/practica las rutas ../../../ apuntan a biblioteca/ igual que desde fisica-N/<practica>/src/) -->
<link rel="stylesheet" data-inline="../../../biblioteca/fuentes/fuentes.css">
<link rel="stylesheet" data-inline="../../../biblioteca/interfaz/interfaz.css">
</head><body>
<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow">Universidad Nacional de Colombia · Sede Medellín · TODO: Física Mecánica · Práctica N</div>
      <h1>TODO: Nombre de la práctica</h1>
    </div>
    <div class="modes" role="group" aria-label="Modo">
      <button class="mode" type="button" data-app="explore">Explorar</button>
      <button class="mode" type="button" data-app="lab">Laboratorio</button>
      <button class="mode guide" type="button" id="bGuide" aria-pressed="true">Paso a paso</button>
    </div>
  </header>
  <nav class="steps" aria-label="Pasos de la práctica"><ol id="steps"></ol></nav>
  <div class="dock" role="toolbar" aria-label="Qué mostrar">
    <button class="dk" type="button" data-ui="card" title="Panel de la práctica (P)"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2.5" y="3.5" width="15" height="13" rx="2"/><path d="M12 3.5v13"/></svg>Panel</button>
    <button class="dk" type="button" data-ui="labels" title="Rótulos en la escena (E)"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3 10.5 9.5 4H16v6.5L9.5 17z"/><circle cx="13" cy="7" r="1.2"/></svg>Rótulos</button>
    <button class="dk sep" type="button" data-ui="clean" title="Ver solo la escena (H)"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3 7V3h4M13 3h4v4M17 13v4h-4M7 17H3v-4"/></svg>Limpia</button>
  </div>
  <button class="unclean" type="button" id="unclean">Mostrar paneles · H</button>
  <div class="hud" id="hud" hidden></div>
  <div class="pad" id="pad" hidden><div class="pad-row"><button class="pb go" type="button" id="padGo">Lanzar</button></div></div>
  <main class="layout">
    <section class="stage">
      <div class="panel viewpanel">
        <div id="view" role="img" aria-label="TODO: describe la escena"></div>
        <div class="viewbtns" role="group" aria-label="Cámara">
          <button class="vb" type="button" data-v="iso" data-s="3D">Vista 3D</button>
          <button class="vb" type="button" data-v="side" data-s="Lado">Lateral</button>
          <button class="vb" type="button" data-v="top" data-s="Arriba">Superior</button>
        </div>
      </div>
    </section>
    <section class="card" id="card" aria-live="polite"></section>
  </main>
</div>

<script data-inline="../../../biblioteca/nucleo/three-r159.min.js"></script>
<script data-inline="../../../biblioteca/nucleo/camara.js"></script>
<script data-inline="../../../biblioteca/fisica/incertidumbre.js"></script>
<script data-inline="../../../biblioteca/interfaz/interfaz.js"></script>
<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
const {fx,pair}=Lab.fisica;

/* ---------- escena (unidades: metros) ---------- */
const view=$('#view'), renderer=new THREE.WebGLRenderer({antialias:true});
THREE.ColorManagement.enabled=false; renderer.outputColorSpace=THREE.LinearSRGBColorSpace;
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2)); renderer.shadowMap.enabled=true; view.appendChild(renderer.domElement);
renderer.domElement.style.touchAction='pan-y';
const scene=new THREE.Scene(); scene.background=new THREE.Color(0xdfe6ee);
const camera=new THREE.PerspectiveCamera(38,1.6,0.05,60);
const controls=new THREE.CamaraOrbita(camera,renderer.domElement,{minDistance:0.4,maxDistance:7.5,maxPolarAngle:Math.PI*0.49});
let dirty=true; controls.addEventListener('change',()=>dirty=true);
scene.add(new THREE.HemisphereLight(0xffffff,0xb9c4d0,0.9*Math.PI));
const sun=new THREE.DirectionalLight(0xfff6e6,0.65*Math.PI); sun.position.set(1.4,3.2,2); sun.castShadow=true; scene.add(sun);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(8,8),new THREE.MeshStandardMaterial({color:0xe3eae6,roughness:0.9})); floor.rotation.x=-Math.PI/2; floor.receiveShadow=true; scene.add(floor);
scene.add(new THREE.GridHelper(8,32,0xc9d3cf,0xd6dedb));
/* TODO: montaje con piezas de biblioteca/piezas/ (mesa, rampa, esfera, fotocompuerta, lente…) */
const mesa=new THREE.Mesh(new THREE.BoxGeometry(0.9,0.04,0.5),new THREE.MeshStandardMaterial({color:0x141c2e,roughness:0.32}));
mesa.position.set(-0.45,0.93,0); mesa.castShadow=true; scene.add(mesa);
const esfera=new THREE.Mesh(new THREE.SphereGeometry(0.02,32,20),new THREE.MeshPhongMaterial({color:0xcdd4da,shininess:90}));
esfera.castShadow=true; scene.add(esfera);
const rotulos=new THREE.Group(); scene.add(rotulos);   // TODO: etiquetas y cotas (se ocultan con "Rótulos")

function setView(n){
  if(n==='side'){ camera.position.set(0.3,0.5,3.6); controls.target.set(0.3,0.45,0); }
  else if(n==='top'){ camera.position.set(0.3,3.4,0.001); controls.target.set(0.3,0,0); }
  else { camera.position.set(1.75,1.5,2.85); controls.target.set(0.2,0.4,0); }
  controls.update(); dirty=true;
}
function resize(){
  const w=view.clientWidth,h=view.clientHeight; if(!w||!h) return;
  renderer.setSize(w,h,false); camera.aspect=w/h;
  const card=$('#card'), side=innerWidth>760&&UI.card&&!UI.clean&&card?card.offsetWidth+24:0, left=innerWidth>760&&!UI.clean?56:0;
  if(side||left) camera.setViewOffset(w,h,(side-left)/2,0,w,h); else camera.clearViewOffset();
  camera.updateProjectionMatrix(); dirty=true;
}
(function loop(){ requestAnimationFrame(loop); if(dirty){ dirty=false; renderer.render(scene,camera); } })();

/* ---------- ejemplo de acción: lanzar (TODO: la física de la práctica) ---------- */
let busy=false;
function lanzar(){
  if(busy) return; busy=true; const v0=1.2, H=0.95+0.02, g=9.77, tf=Math.sqrt(2*0.95/g), t0=performance.now();
  (function paso(now){ const t=Math.min(tf,(now-t0)/1000*0.5); esfera.position.set(v0*t,H-0.5*g*t*t,0); dirty=true;
    if(t<tf) requestAnimationFrame(paso); else { busy=false; const o=$('#res'); if(o) o.textContent='Alcance D = '+fx(v0*tf,3)+' m'; } })(t0);
}

/* ---------- páginas: Explorar, Laboratorio y pasos (TODO) ---------- */
const EXPLORE={title:'Explora',render:()=>'<p class="lead">TODO: modo libre. Cambia condiciones y observa; nada se califica.</p><div class="row"><button class="btn primary" id="go">Lanzar · Espacio</button></div><p class="small" id="res"></p>',mount(){ $('#go').onclick=lanzar; }};
const LABFREE={title:'Laboratorio',render:()=>'<p class="lead">TODO: toma de datos, tabla y "Tus cálculos" con verificación (ver parabólico).</p><div class="row"><button class="btn primary" id="go">Lanzar · Espacio</button></div><p class="small" id="res"></p>',mount(){ $('#go').onclick=lanzar; }};
const STEPS=[
  {label:'La idea',title:'TODO: qué se mide y por qué',render:()=>'<p class="lead">TODO</p>'},
  {label:'Montaje',title:'TODO: montaje y medidas',render:()=>'<p class="lead">TODO</p><div class="eq">'+pair(0.950,0.001).join(' ± ')+' m</div>'},
  {label:'Tomar datos',title:'TODO: toma de datos',render:()=>'<div class="row"><button class="btn primary" id="go">Lanzar</button></div><p class="small" id="res"></p>',mount(){ $('#go').onclick=lanzar; }},
];
let app='explore', guide=true, cur=0;
function pinta(st,kicker,pager){
  $('#card').innerHTML='<p class="kicker">'+kicker+'</p><h2>'+st.title+'</h2>'+st.render()+(pager?'<div class="pager"><button class="btn" id="prev" '+(cur===0?'disabled':'')+'>← Anterior</button><button class="btn primary" id="next" '+(cur===STEPS.length-1?'disabled':'')+'>Siguiente →</button></div>':'');
  if(pager){ $('#prev').onclick=()=>go(cur-1); $('#next').onclick=()=>go(cur+1); }
  if(st.mount) st.mount(); actualizarPad();
}
function go(i){ app='lab'; guide=true; cur=i; sincroniza(); pinta(STEPS[i],'Paso '+(i+1)+' de '+STEPS.length,true);
  document.querySelectorAll('#steps button').forEach((b,j)=>j===i?b.setAttribute('aria-current','step'):b.removeAttribute('aria-current')); }
function setApp(a){ app=a; sincroniza(); if(a==='explore') pinta(EXPLORE,'Modo explorar'); else if(guide) go(cur); else pinta(LABFREE,'Modo laboratorio'); }
function sincroniza(){
  document.querySelectorAll('.mode[data-app]').forEach(b=>b.classList.toggle('on',b.dataset.app===app));
  $('#bGuide').hidden=app!=='lab'; $('#bGuide').setAttribute('aria-pressed',String(guide));
  $('nav.steps').hidden=!(app==='lab'&&guide); Lab.ui.ubicarBarras();
}

/* ---------- qué mostrar, teclado y control táctil ---------- */
const CLAVE='practica-ui';   // TODO: una clave por práctica
const UI=Lab.ui.cargarPreferencias(CLAVE);
function aplicaUI(){ Lab.ui.aplicarClases(UI); Lab.ui.guardarPreferencias(CLAVE,UI); rotulos.visible=UI.labels&&!UI.clean; Lab.ui.ubicarBarras(); resize(); actualizarPad(); }
function alterna(k){ UI[k]=!UI[k]; if(k!=='clean') UI.clean=false; aplicaUI(); }
function actualizarPad(){ const on=Lab.ui.esTactil()&&(UI.clean||!UI.card); $('#pad').hidden=!on;
  const h=$('#hud'); h.hidden=!(!Lab.ui.esTactil()&&(UI.clean||!UI.card)); h.innerHTML='<span class="keys"><kbd>Espacio</kbd> lanzar · <kbd>H</kbd> paneles</span>'; }
Lab.ui.teclas({h:()=>alterna('clean'),p:()=>alterna('card'),e:()=>alterna('labels'),
  Escape:()=>{ if(!UI.clean) return false; alterna('clean'); }, ' ':()=>lanzar(), Enter:()=>lanzar(),
  ArrowRight:()=>{ if(!(app==='lab'&&guide)||cur>=STEPS.length-1) return false; go(cur+1); },
  ArrowLeft:()=>{ if(!(app==='lab'&&guide)||cur<=0) return false; go(cur-1); }});

/* ---------- arranque ---------- */
STEPS.forEach((s,i)=>{ const li=document.createElement('li'),b=document.createElement('button'); b.type='button'; b.innerHTML='<span class="n">'+(i+1)+'</span><span>'+s.label+'</span>'; b.onclick=()=>go(i); li.appendChild(b); $('#steps').appendChild(li); });
document.querySelectorAll('.mode[data-app]').forEach(b=>b.onclick=()=>setApp(b.dataset.app));
$('#bGuide').onclick=()=>{ guide=!guide; setApp('lab'); };
document.querySelectorAll('[data-ui]').forEach(b=>b.onclick=()=>alterna(b.dataset.ui));
$('#unclean').onclick=()=>alterna('clean'); $('#padGo').onclick=lanzar;
document.querySelectorAll('.vb').forEach(b=>b.onclick=()=>setView(b.dataset.v));
new ResizeObserver(resize).observe(view); addEventListener('resize',()=>{ Lab.ui.ubicarBarras(); actualizarPad(); });
esfera.position.set(0,0.97,0); setView('iso'); aplicaUI(); setApp(/laboratorio/.test(location.hash)?'lab':'explore');
})();
</script>
</body></html>
